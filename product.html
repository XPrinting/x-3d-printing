<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>X3D Printing | Products</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =========================================
   RESET
========================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


/* =========================================
   VARIABLES
========================================= */

:root{

    --bg:#080816;

    --surface:#11172a;

    --surface2:#0b1020;

    --border:rgba(255,255,255,.10);

    --text:#fff;

    --muted:#aeb6cc;

    --primary:#8b5cf6;

    --green:#22c55e;

    --red:#ef4444;

    --blue:#3b82f6;

}


/* =========================================
   BODY
========================================= */

body{

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        radial-gradient(
            circle at top right,
            #17153b 0%,
            #080816 45%
        ),
        var(--bg);

    color:var(--text);

    min-height:100vh;

}


/* =========================================
   SIDEBAR
========================================= */

.sidebar{

    position:fixed;

    left:0;

    top:0;

    width:250px;

    height:100vh;

    background:
        rgba(10,12,28,.96);

    border-right:
        1px solid var(--border);

    padding:
        25px 18px;

    z-index:100;

}


.logo{

    font-size:25px;

    font-weight:800;

    padding:
        10px 12px 30px;

}


.logo span{

    color:var(--primary);

}


.menu-title{

    color:#68728a;

    font-size:11px;

    font-weight:bold;

    text-transform:uppercase;

    padding:
        0 12px;

    margin-bottom:10px;

}


.menu{

    display:flex;

    flex-direction:column;

    gap:6px;

}


.menu-item{

    display:flex;

    align-items:center;

    gap:12px;

    color:var(--muted);

    padding:
        13px 14px;

    border-radius:11px;

    cursor:pointer;

    transition:.2s;

    text-decoration:none;

}


.menu-item:hover,
.menu-item.active{

    background:
        rgba(139,92,246,.16);

    color:#fff;

}


.menu-item.active{

    border-left:
        3px solid var(--primary);

}


.menu-icon{

    width:24px;

    text-align:center;

}


/* =========================================
   MAIN
========================================= */

.main{

    margin-left:250px;

    padding:
        30px 35px;

}


.topbar{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:25px;

    gap:20px;

}


.page-title h1{

    font-size:30px;

    margin-bottom:7px;

}


.page-title p{

    color:var(--muted);

}


.add-btn{

    border:
        1px solid rgba(139,92,246,.4);

    background:
        linear-gradient(
            135deg,
            #5b21b6,
            #8b5cf6
        );

    color:#fff;

    padding:
        12px 18px;

    border-radius:10px;

    cursor:pointer;

    font-weight:bold;

}


/* =========================================
   STATS
========================================= */

.stats{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:18px;

    margin-bottom:25px;

}


.stat-card{

    background:
        rgba(17,23,42,.92);

    border:
        1px solid var(--border);

    border-radius:17px;

    padding:20px;

}


.stat-label{

    color:var(--muted);

    font-size:13px;

    margin-bottom:10px;

}


.stat-value{

    font-size:28px;

    font-weight:bold;

}


/* =========================================
   PRODUCTS CARD
========================================= */

.products-card{

    background:
        rgba(17,23,42,.92);

    border:
        1px solid var(--border);

    border-radius:20px;

    overflow:hidden;

}


.products-header{

    padding:22px;

    border-bottom:
        1px solid var(--border);

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:15px;

}


.products-header h2{

    font-size:21px;

}


.search{

    background:#0b1020;

    border:
        1px solid var(--border);

    color:#fff;

    padding:
        11px 14px;

    border-radius:9px;

    outline:none;

    width:260px;

}


.search:focus{

    border-color:var(--primary);

}


.table-wrapper{

    width:100%;

    overflow-x:auto;

}


table{

    width:100%;

    border-collapse:collapse;

    min-width:1000px;

}


th{

    text-align:left;

    color:#7f89a3;

    font-size:12px;

    text-transform:uppercase;

    padding:
        16px 20px;

    background:
        rgba(7,10,23,.45);

}


td{

    padding:
        15px 20px;

    border-top:
        1px solid var(--border);

}


tr:hover td{

    background:
        rgba(139,92,246,.04);

}


/* =========================================
   PRODUCT IMAGE
========================================= */

.product-image{

    width:55px;

    height:55px;

    border-radius:10px;

    object-fit:cover;

    background:#0b1020;

    border:
        1px solid var(--border);

}


.product-name{

    font-weight:bold;

}


.product-description{

    color:var(--muted);

    font-size:12px;

    margin-top:4px;

    max-width:300px;

    white-space:normal;

}


.price{

    font-weight:bold;

}


.stock{

    color:#aeb6cc;

}


.active{

    color:#4ade80;

    font-weight:bold;

}


.inactive{

    color:#f87171;

    font-weight:bold;

}


/* =========================================
   BUTTONS
========================================= */

.edit-btn,
.delete-btn{

    padding:
        7px 11px;

    border-radius:8px;

    cursor:pointer;

    font-size:12px;

}


.edit-btn{

    border:
        1px solid rgba(139,92,246,.35);

    background:
        rgba(139,92,246,.10);

    color:#c4b5fd;

}


.delete-btn{

    border:
        1px solid rgba(239,68,68,.3);

    background:
        rgba(239,68,68,.10);

    color:#f87171;

    margin-left:5px;

}


/* =========================================
   LOADING / ERROR
========================================= */

.loading,
.empty,
.error{

    padding:50px;

    text-align:center;

    color:var(--muted);

}


.error{

    color:#f87171;

}


/* =========================================
   MODAL
========================================= */

.modal{

    display:none;

    position:fixed;

    inset:0;

    background:
        rgba(0,0,0,.75);

    z-index:500;

    align-items:center;

    justify-content:center;

    padding:20px;

}


.modal-box{

    width:100%;

    max-width:650px;

    max-height:90vh;

    overflow-y:auto;

    background:#11172a;

    border:
        1px solid var(--border);

    border-radius:20px;

    padding:25px;

}


.modal-header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:25px;

}


.close{

    background:transparent;

    border:none;

    color:#fff;

    font-size:28px;

    cursor:pointer;

}


.form-grid{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:15px;

}


.form-group{

    display:flex;

    flex-direction:column;

    gap:7px;

}


.form-group.full{

    grid-column:1/-1;

}


label{

    color:#aeb6cc;

    font-size:13px;

}


input,
textarea,
select{

    width:100%;

    background:#0b1020;

    border:
        1px solid var(--border);

    color:#fff;

    padding:12px;

    border-radius:9px;

    outline:none;

}


input:focus,
textarea:focus,
select:focus{

    border-color:var(--primary);

}


textarea{

    min-height:100px;

    resize:vertical;

}


/* =========================================
   FILE INPUT
========================================= */

input[type="file"]{

    cursor:pointer;

    padding:10px;

}


input[type="file"]::file-selector-button{

    background:
        linear-gradient(
            135deg,
            #5b21b6,
            #8b5cf6
        );

    color:white;

    border:none;

    padding:
        8px 12px;

    border-radius:7px;

    cursor:pointer;

    margin-right:10px;

}


/* =========================================
   IMAGE PREVIEW
========================================= */

.image-preview-container{

    display:none;

    margin-top:10px;

    padding:12px;

    background:#0b1020;

    border:
        1px solid var(--border);

    border-radius:12px;

}


.image-preview{

    width:130px;

    height:130px;

    object-fit:cover;

    border-radius:12px;

    border:
        1px solid var(--border);

    display:block;

}


/* =========================================
   UPLOAD STATUS
========================================= */

.upload-status{

    display:none;

    margin-top:8px;

    font-size:12px;

    color:var(--muted);

}


/* =========================================
   SAVE
========================================= */

.save-btn{

    width:100%;

    margin-top:20px;

    padding:13px;

    border:none;

    border-radius:10px;

    background:
        linear-gradient(
            135deg,
            #6d28d9,
            #8b5cf6
        );

    color:#fff;

    font-weight:bold;

    cursor:pointer;

}


.save-btn:disabled{

    opacity:.6;

    cursor:not-allowed;

}


/* =========================================
   MOBILE
========================================= */

@media(max-width:900px){

    .sidebar{

        position:relative;

        width:100%;

        height:auto;

        border-right:none;

        border-bottom:
            1px solid var(--border);

    }


    .main{

        margin-left:0;

        padding:
            22px 15px;

    }


    .menu{

        flex-direction:row;

        overflow-x:auto;

    }


    .menu-item{

        min-width:max-content;

    }


    .menu-title{

        display:none;

    }


    .stats{

        grid-template-columns:1fr;

    }


    .topbar{

        flex-direction:column;

        align-items:flex-start;

    }


    .add-btn{

        width:100%;

    }


    .products-header{

        flex-direction:column;

        align-items:stretch;

    }


    .search{

        width:100%;

    }


    .form-grid{

        grid-template-columns:1fr;

    }


    .form-group.full{

        grid-column:auto;

    }

}

</style>

</head>


<body>

<aside class="sidebar">

<script>


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://wxezuqdktbftlkjxqcmi.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_Z1_vjXxFAUU_PAI05Hqd4w_zjopEwwH";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


/* =========================================
   STORAGE BUCKET
========================================= */

const PRODUCT_BUCKET =
"product-images";


/* =========================================
   GLOBAL
========================================= */

let products = [];

let editingId = null;


/* =========================================
   LOAD PRODUCTS
========================================= */

async function loadProducts(){

    const container =
        document.getElementById(
            "tableContainer"
        );


    container.innerHTML = `

        <div class="loading">

            Loading products...

        </div>

    `;


    try{


        const { data, error } =
            await supabaseClient

                .from("products")

                .select("*")

                .order(
                    "id",
                    {
                        ascending:false
                    }
                );


        if(error){

            console.error(error);

            container.innerHTML = `

                <div class="error">

                    ❌ Failed to load products.

                    <br><br>

                    ${escapeHtml(
                        error.message
                    )}

                </div>

            `;

            return;

        }


        products =
            data || [];


        updateStats();

        renderProducts();


    }

    catch(error){

        console.error(error);

        container.innerHTML = `

            <div class="error">

                ❌ Something went wrong.

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;

    }

}


/* =========================================
   STATS
========================================= */

function updateStats(){

    document
        .getElementById("totalProducts")
        .textContent =
            products.length;


    document
        .getElementById("activeProducts")
        .textContent =

            products.filter(
                p =>
                    p.is_active !== false
            ).length;


    document
        .getElementById("outOfStock")
        .textContent =

            products.filter(
                p =>
                    Number(
                        p.stock || 0
                    ) <= 0
            ).length;

}


/* =========================================
   RENDER PRODUCTS
========================================= */

function renderProducts(){

    const container =
        document.getElementById(
            "tableContainer"
        );


    const search =
        document.getElementById(
            "searchInput"
        )
        .value
        .toLowerCase()
        .trim();


    let filtered =
        [...products];


    if(search){

        filtered =
            filtered.filter(
                product => {

                    const name =
                        String(
                            product.name || ""
                        )
                        .toLowerCase();


                    const category =
                        String(
                            product.category || ""
                        )
                        .toLowerCase();


                    const description =
                        String(
                            product.description || ""
                        )
                        .toLowerCase();


                    return (

                        name.includes(search)

                        ||

                        category.includes(search)

                        ||

                        description.includes(search)

                    );

                }
            );

    }


    if(!filtered.length){

        container.innerHTML = `

            <div class="empty">

                No products found.

            </div>

        `;

        return;

    }


    container.innerHTML = `

        <table>

            <thead>

                <tr>

                    <th>
                        Image
                    </th>

                    <th>
                        Product
                    </th>

                    <th>
                        Category
                    </th>

                    <th>
                        Price
                    </th>

                    <th>
                        Stock
                    </th>

                    <th>
                        Status
                    </th>

                    <th>
                        Actions
                    </th>

                </tr>

            </thead>


            <tbody>

                ${

                    filtered
                    .map(
                        product => `

                            <tr>


                                <td>

                                    ${
                                        product.image_url

                                        ?

                                        `
                                        <img
                                            class="product-image"
                                            src="${escapeHtml(
                                                product.image_url
                                            )}"
                                            alt="${escapeHtml(
                                                product.name || "Product"
                                            )}"
                                            onerror="
                                                this.onerror=null;
                                                this.src='';
                                            "
                                        >
                                        `

                                        :

                                        `
                                        <div
                                            class="product-image"
                                            style="
                                                display:flex;
                                                align-items:center;
                                                justify-content:center;
                                                color:#68728a;
                                                font-size:22px;
                                            "
                                        >
                                            📦
                                        </div>
                                        `
                                    }

                                </td>


                                <td>

                                    <div
                                        class="product-name"
                                    >

                                        ${escapeHtml(
                                            product.name || "-"
                                        )}

                                    </div>


                                    <div
                                        class="product-description"
                                    >

                                        ${escapeHtml(
                                            product.description || ""
                                        )}

                                    </div>

                                </td>


                                <td>

                                    ${escapeHtml(
                                        product.category || "-"
                                    )}

                                </td>


                                <td>

                                    <span
                                        class="price"
                                    >

                                        EGP ${Number(
                                            product.price || 0
                                        ).toLocaleString()}

                                    </span>

                                </td>


                                <td>

                                    <span
                                        class="stock"
                                    >

                                        ${escapeHtml(
                                            product.stock ?? 0
                                        )}

                                    </span>

                                </td>


                                <td>

                                    ${
                                        product.is_active !== false

                                        ?

                                        `<span class="active">
                                            Active
                                        </span>`

                                        :

                                        `<span class="inactive">
                                            Inactive
                                        </span>`
                                    }

                                </td>


                                <td>

                                    <button
                                        class="edit-btn"
                                        onclick="editProduct(${Number(
                                            product.id
                                        )})"
                                    >

                                        Edit

                                    </button>


                                    <button
                                        class="delete-btn"
                                        onclick="deleteProduct(${Number(
                                            product.id
                                        )})"
                                    >

                                        Delete

                                    </button>

                                </td>


                            </tr>

                        `
                    )
                    .join("")

                }

            </tbody>

        </table>

    `;

}


/* =========================================
   IMAGE PREVIEW
========================================= */

function previewImage(event){

    const file =
        event.target.files[0];


    const previewContainer =
        document.getElementById(
            "imagePreviewContainer"
        );


    const preview =
        document.getElementById(
            "imagePreview"
        );


    if(!file){

        previewContainer.style.display =
            "none";

        preview.src = "";

        return;

    }


    if(!file.type.startsWith("image/")){

        alert(
            "Please select a valid image file."
        );

        event.target.value = "";

        previewContainer.style.display =
            "none";

        return;

    }


    if(
        file.size >
        5 * 1024 * 1024
    ){

        alert(
            "Image size must be less than 5 MB."
        );

        event.target.value = "";

        previewContainer.style.display =
            "none";

        return;

    }


    const reader =
        new FileReader();


    reader.onload =
        function(e){

            preview.src =
                e.target.result;

            previewContainer.style.display =
                "block";

        };


    reader.readAsDataURL(file);

}


/* =========================================
   UPLOAD IMAGE TO SUPABASE STORAGE
========================================= */

async function uploadProductImage(file){

    if(!file){

        return null;

    }


    if(!file.type.startsWith("image/")){

        throw new Error(
            "Please select a valid image."
        );

    }


    if(
        file.size >
        5 * 1024 * 1024
    ){

        throw new Error(
            "Image size must be less than 5 MB."
        );

    }


    const originalName =
        file.name
        .replace(
            /\.[^/.]+$/,
            ""
        )
        .replace(
            /[^a-zA-Z0-9-_]/g,
            "-"
        )
        .toLowerCase();


    const extension =
        file.name
        .split(".")
        .pop()
        .toLowerCase();


    const filePath =

        `${Date.now()}-${crypto.randomUUID()}-${originalName}.${extension}`;


    const {
        error: uploadError
    } =

        await supabaseClient

            .storage

            .from(
                PRODUCT_BUCKET
            )

            .upload(
                filePath,
                file,
                {

                    cacheControl:
                        "3600",

                    upsert:
                        false,

                    contentType:
                        file.type

                }
            );


    if(uploadError){

        console.error(
            "Upload error:",
            uploadError
        );

        throw new Error(
            uploadError.message
        );

    }


    const {
        data
    } =

        supabaseClient

            .storage

            .from(
                PRODUCT_BUCKET
            )

            .getPublicUrl(
                filePath
            );


    if(
        !data ||
        !data.publicUrl
    ){

        throw new Error(
            "Could not get image URL."
        );

    }


    return data.publicUrl;

}

/* =========================================
   SAVE PRODUCT
========================================= */

async function saveProduct(){

    const button =
        document.getElementById(
            "saveProductButton"
        );


    const name =
        document
            .getElementById(
                "productName"
            )
            .value
            .trim();


    const category =
        document
            .getElementById(
                "productCategory"
            )
            .value
            .trim();


    const description =
        document
            .getElementById(
                "productDescription"
            )
            .value
            .trim();


    const price =
        Number(
            document
                .getElementById(
                    "productPrice"
                )
                .value
        );


    const stock =
        Number(
            document
                .getElementById(
                    "productStock"
                )
                .value
        );


    const is_active =
        document
            .getElementById(
                "productActive"
            )
            .value ===
            "true";


    const imageFile =
        document
            .getElementById(
                "productImageFile"
            )
            .files[0];


    /* =====================================
       VALIDATION
    ====================================== */

    if(!name){

        alert(
            "Please enter product name."
        );

        return;

    }


    if(isNaN(price)){

        alert(
            "Please enter a valid price."
        );

        return;

    }


    if(isNaN(stock) || stock < 0){

        alert(
            "Please enter a valid stock."
        );

        return;

    }


    /* =====================================
       EXISTING PRODUCT
    ====================================== */

    let existingProduct =
        null;


    if(editingId){

        existingProduct =
            products.find(
                p =>
                    Number(p.id) ===
                    Number(editingId)
            );

    }


    let image_url =
        existingProduct?.image_url ||
        "";


    try{


        button.disabled =
            true;


        button.textContent =
            "Saving...";


        /* =================================
           UPLOAD NEW IMAGE
        ================================= */

        if(imageFile){

            const status =
                document.getElementById(
                    "uploadStatus"
                );


            status.style.display =
                "block";


            status.textContent =
                "Uploading image...";


            image_url =
                await uploadProductImage(
                    imageFile
                );


            status.textContent =
                "Image uploaded successfully ✓";

        }


        /* =================================
           PRODUCT DATA
        ================================= */

        const productData = {

            name,

            category,

            description,

            price,

            stock,

            image_url,

            is_active

        };


        /* =================================
           DATABASE
        ================================= */

        let result;


        if(editingId){

            result =
                await supabaseClient

                    .from("products")

                    .update(
                        productData
                    )

                    .eq(
                        "id",
                        editingId
                    );

        }

        else{

            result =
                await supabaseClient

                    .from("products")

                    .insert(
                        productData
                    );

        }


        if(result.error){

            console.error(
                result.error
            );


            throw new Error(
                result.error.message
            );

        }


        alert(

            editingId

            ?

            "Product updated successfully!"

            :

            "Product added successfully!"

        );


        closeModal();


        await loadProducts();

    }

    catch(error){

        console.error(
            "Save product error:",
            error
        );


        alert(

            "Failed to save product:\n\n" +
            error.message

        );

    }

    finally{

        button.disabled =
            false;

        button.textContent =
            "Save Product";

    }

}


/* =========================================
   DELETE PRODUCT
========================================= */

async function deleteProduct(id){

    const product =
        products.find(
            p =>
                Number(p.id) ===
                Number(id)
        );


    if(!product){

        return;

    }


    const confirmed =
        confirm(
            `Delete "${product.name}"?`
        );


    if(!confirmed){

        return;

    }


    try{


        const { error } =
            await supabaseClient

                .from("products")

                .delete()

                .eq(
                    "id",
                    id
                );


        if(error){

            throw new Error(
                error.message
            );

        }


        alert(
            "Product deleted successfully!"
        );


        await loadProducts();

    }

    catch(error){

        console.error(
            error
        );


        alert(

            "Failed to delete product:\n\n" +
            error.message

        );

    }

}

/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
