<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>X3D Printing | Products</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg:#080816;
    --surface:#11172a;
    --surface2:#0b1020;
    --border:rgba(255,255,255,.10);
    --text:#fff;
    --muted:#aeb6cc;
    --primary:#8b5cf6;
    --green:#22c55e;
    --red:#ef4444;
    --blue:#3b82f6;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at top right,#17153b 0%,#080816 45%),
        var(--bg);
    color:var(--text);
    min-height:100vh;
}


/* =========================
   SIDEBAR
========================= */

.sidebar{
    position:fixed;
    left:0;
    top:0;
    width:250px;
    height:100vh;
    background:rgba(10,12,28,.96);
    border-right:1px solid var(--border);
    padding:25px 18px;
    z-index:100;
}

.logo{
    font-size:25px;
    font-weight:800;
    padding:10px 12px 30px;
}

.logo span{
    color:var(--primary);
}

.menu-title{
    color:#68728a;
    font-size:11px;
    font-weight:bold;
    text-transform:uppercase;
    padding:0 12px;
    margin-bottom:10px;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.menu-item{
    display:flex;
    align-items:center;
    gap:12px;
    color:var(--muted);
    padding:13px 14px;
    border-radius:11px;
    cursor:pointer;
    transition:.2s;
    text-decoration:none;
}

.menu-item:hover,
.menu-item.active{
    background:rgba(139,92,246,.16);
    color:#fff;
}

.menu-item.active{
    border-left:3px solid var(--primary);
}

.menu-icon{
    width:24px;
    text-align:center;
}


/* =========================
   MAIN
========================= */

.main{
    margin-left:250px;
    padding:30px 35px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
    gap:20px;
}

.page-title h1{
    font-size:30px;
    margin-bottom:7px;
}

.page-title p{
    color:var(--muted);
}

.add-btn{
    border:1px solid rgba(139,92,246,.4);
    background:linear-gradient(135deg,#5b21b6,#8b5cf6);
    color:#fff;
    padding:12px 18px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}


/* =========================
   STATS
========================= */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
    margin-bottom:25px;
}

.stat-card{
    background:rgba(17,23,42,.92);
    border:1px solid var(--border);
    border-radius:17px;
    padding:20px;
}

.stat-label{
    color:var(--muted);
    font-size:13px;
    margin-bottom:10px;
}

.stat-value{
    font-size:28px;
    font-weight:bold;
}


/* =========================
   PRODUCTS
========================= */

.products-card{
    background:rgba(17,23,42,.92);
    border:1px solid var(--border);
    border-radius:20px;
    overflow:hidden;
}

.products-header{
    padding:22px;
    border-bottom:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.products-header h2{
    font-size:21px;
}

.search{
    background:#0b1020;
    border:1px solid var(--border);
    color:#fff;
    padding:11px 14px;
    border-radius:9px;
    outline:none;
    width:260px;
}

.search:focus{
    border-color:var(--primary);
}

.table-wrapper{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:1000px;
}

th{
    text-align:left;
    color:#7f89a3;
    font-size:12px;
    text-transform:uppercase;
    padding:16px 20px;
    background:rgba(7,10,23,.45);
}

td{
    padding:15px 20px;
    border-top:1px solid var(--border);
}

tr:hover td{
    background:rgba(139,92,246,.04);
}

.product-image{
    width:55px;
    height:55px;
    border-radius:10px;
    object-fit:cover;
    background:#0b1020;
    border:1px solid var(--border);
}

.product-name{
    font-weight:bold;
}

.product-description{
    color:var(--muted);
    font-size:12px;
    margin-top:4px;
    max-width:300px;
    white-space:normal;
}

.price{
    font-weight:bold;
}

.stock{
    color:#aeb6cc;
}

.active{
    color:#4ade80;
    font-weight:bold;
}

.inactive{
    color:#f87171;
    font-weight:bold;
}


/* =========================
   BUTTONS
========================= */

.edit-btn,
.delete-btn{
    padding:7px 11px;
    border-radius:8px;
    cursor:pointer;
    font-size:12px;
}

.edit-btn{
    border:1px solid rgba(139,92,246,.35);
    background:rgba(139,92,246,.10);
    color:#c4b5fd;
}

.delete-btn{
    border:1px solid rgba(239,68,68,.3);
    background:rgba(239,68,68,.10);
    color:#f87171;
    margin-left:5px;
}


/* =========================
   EMPTY / LOADING
========================= */

.loading,
.empty,
.error{
    padding:50px;
    text-align:center;
    color:var(--muted);
}

.error{
    color:#f87171;
}


/* =========================
   MODAL
========================= */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    z-index:500;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal-box{
    width:100%;
    max-width:650px;
    max-height:90vh;
    overflow-y:auto;
    background:#11172a;
    border:1px solid var(--border);
    border-radius:20px;
    padding:25px;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.close{
    background:transparent;
    border:none;
    color:#fff;
    font-size:28px;
    cursor:pointer;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.form-group{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.form-group.full{
    grid-column:1/-1;
}

label{
    color:#aeb6cc;
    font-size:13px;
}

input,
textarea,
select{
    width:100%;
    background:#0b1020;
    border:1px solid var(--border);
    color:#fff;
    padding:12px;
    border-radius:9px;
    outline:none;
}

textarea{
    min-height:100px;
    resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
    border-color:var(--primary);
}


/* =========================
   FILE INPUT
========================= */

.file-input{
    padding:10px;
    cursor:pointer;
}

.file-input::file-selector-button{
    border:none;
    background:linear-gradient(135deg,#6d28d9,#8b5cf6);
    color:#fff;
    padding:9px 14px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    margin-right:10px;
}

.image-preview{
    margin-top:10px;
    display:none;
}

.image-preview img{
    width:120px;
    height:120px;
    object-fit:cover;
    border-radius:12px;
    border:1px solid var(--border);
}

.current-image{
    margin-top:10px;
    display:none;
}

.current-image img{
    width:120px;
    height:120px;
    object-fit:cover;
    border-radius:12px;
    border:1px solid var(--border);
}

.image-info{
    color:var(--muted);
    font-size:12px;
    margin-top:7px;
}


/* =========================
   SAVE
========================= */

.save-btn{
    width:100%;
    margin-top:20px;
    padding:13px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg,#6d28d9,#8b5cf6);
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}

.save-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}


/* =========================
   MOBILE
========================= */

@media(max-width:900px){

    .sidebar{
        position:relative;
        width:100%;
        height:auto;
        border-right:none;
        border-bottom:1px solid var(--border);
    }

    .main{
        margin-left:0;
        padding:22px 15px;
    }

    .menu{
        flex-direction:row;
        overflow-x:auto;
    }

    .menu-item{
        min-width:max-content;
    }

    .menu-title{
        display:none;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .topbar{
        flex-direction:column;
        align-items:flex-start;
    }

    .add-btn{
        width:100%;
    }

    .products-header{
        flex-direction:column;
        align-items:stretch;
    }

    .search{
        width:100%;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .form-group.full{
        grid-column:auto;
    }

}

</style>

</head>

<script>


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://wxezuqdktbftlkjxqcmi.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_Z1_vjXxFAUU_PAI05Hqd4w_zjopEwwH";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);


/* =========================================
   STORAGE
========================================= */

const STORAGE_BUCKET =
"product-images";


/* =========================================
   GLOBAL
========================================= */

let products = [];

let editingId = null;


/* =========================================
   LOAD PRODUCTS
========================================= */

async function loadProducts(){

const container =
document.getElementById("tableContainer");

container.innerHTML = `
<div class="loading">
Loading products...
</div>
`;

try{

const {data,error} =
await supabaseClient
.from("products")
.select("*")
.order("id",{ascending:false});

if(error){

console.error(error);

container.innerHTML = `
<div class="error">
❌ Failed to load products.
<br><br>
${escapeHtml(error.message)}
</div>
`;

return;
}

products = data || [];

updateStats();

renderProducts();

}

catch(error){

console.error(error);

container.innerHTML = `
<div class="error">
❌ Something went wrong.
<br><br>
${escapeHtml(error.message)}
</div>
`;

}

}


/* =========================================
   STATS
========================================= */

function updateStats(){

document.getElementById("totalProducts")
.textContent =
products.length;


document.getElementById("activeProducts")
.textContent =
products.filter(
p => p.is_active !== false
).length;


document.getElementById("outOfStock")
.textContent =
products.filter(
p => Number(p.stock || 0) <= 0
).length;

}


/* =========================================
   RENDER PRODUCTS
========================================= */

function renderProducts(){

const container =
document.getElementById("tableContainer");

const search =
document.getElementById("searchInput")
.value
.toLowerCase()
.trim();


let filtered =
[...products];


if(search){

filtered =
filtered.filter(product => {

const name =
String(
product.name || ""
).toLowerCase();

const category =
String(
product.category || ""
).toLowerCase();

const description =
String(
product.description || ""
).toLowerCase();

return (
name.includes(search) ||
category.includes(search) ||
description.includes(search)
);

});

}


if(!filtered.length){

container.innerHTML = `
<div class="empty">
No products found.
</div>
`;

return;

}


container.innerHTML = `

<table>

<thead>

<tr>

<th>Image</th>

<th>Product</th>

<th>Category</th>

<th>Price</th>

<th>Stock</th>

<th>Status</th>

<th>Actions</th>

</tr>

</thead>

<tbody>

${filtered.map(product => `

<tr>

<td>

${
product.image_url
?
`
<img
class="product-image"
src="${escapeHtml(product.image_url)}"
alt="${escapeHtml(product.name || "Product")}"
onerror="this.style.display='none'"
>
`
:
`
<div class="product-image"></div>
`
}

</td>


<td>

<div class="product-name">

${escapeHtml(
product.name || "-"
)}

</div>

<div class="product-description">

${escapeHtml(
product.description || ""
)}

</div>

</td>


<td>

${escapeHtml(
product.category || "-"
)}

</td>


<td>

<span class="price">

EGP ${Number(
product.price || 0
).toLocaleString()}

</span>

</td>


<td>

<span class="stock">

${escapeHtml(
product.stock ?? 0
)}

</span>

</td>


<td>

${
product.is_active !== false
?
`<span class="active">Active</span>`
:
`<span class="inactive">Inactive</span>`
}

</td>


<td>

<button
class="edit-btn"
onclick="editProduct(${Number(product.id)})"
>
Edit
</button>

<button
class="delete-btn"
onclick="deleteProduct(${Number(product.id)})"
>
Delete
</button>

</td>

</tr>

`).join("")}

</tbody>

</table>

`;

}


/* =========================================
   OPEN ADD MODAL
========================================= */

function openAddModal(){

editingId = null;

document.getElementById("modalTitle")
.textContent =
"Add Product";

clearForm();

document.getElementById("currentImage")
.style.display =
"none";

document.getElementById("imagePreview")
.style.display =
"none";

document.getElementById("imageInfo")
.textContent =
"Choose an image from your computer.";

document.getElementById("productModal")
.style.display =
"flex";

}


/* =========================================
   EDIT PRODUCT
========================================= */

function editProduct(id){

const product =
products.find(
p => Number(p.id) === Number(id)
);

if(!product)
return;


editingId =
product.id;


document.getElementById("modalTitle")
.textContent =
"Edit Product";


document.getElementById("productName")
.value =
product.name || "";


document.getElementById("productCategory")
.value =
product.category || "";


document.getElementById("productDescription")
.value =
product.description || "";


document.getElementById("productPrice")
.value =
product.price || "";


document.getElementById("productStock")
.value =
product.stock ?? 0;


document.getElementById("productImage")
.value =
"";


document.getElementById("productActive")
.value =
product.is_active === false
?
"false"
:
"true";


/* CURRENT IMAGE */

const currentImage =
document.getElementById("currentImage");

const currentImagePreview =
document.getElementById("currentImagePreview");


if(product.image_url){

currentImagePreview.src =
product.image_url;

currentImage.style.display =
"block";

}

else{

currentImage.style.display =
"none";

}


/* RESET NEW IMAGE */

document.getElementById("imagePreview")
.style.display =
"none";


document.getElementById("imageInfo")
.textContent =
"Choose a new image only if you want to replace the current image.";


document.getElementById("productModal")
.style.display =
"flex";

}


/* =========================================
   PREVIEW IMAGE
========================================= */

function previewSelectedImage(event){

const file =
event.target.files[0];


if(!file){

document.getElementById("imagePreview")
.style.display =
"none";

return;

}


/* CHECK IMAGE */

if(!file.type.startsWith("image/")){

alert("Please select an image file.");

event.target.value = "";

return;

}


/* SIZE */

const maxSize =
5 * 1024 * 1024;


if(file.size > maxSize){

alert(
"Image size must be less than 5MB."
);

event.target.value = "";

return;

}


/* PREVIEW */

const reader =
new FileReader();


reader.onload =
function(e){

document.getElementById(
"selectedImagePreview"
).src =
e.target.result;


document.getElementById(
"imagePreview"
).style.display =
"block";


document.getElementById(
"imageInfo"
).textContent =
file.name;

};


reader.readAsDataURL(file);

}


/* =========================================
   UPLOAD IMAGE
========================================= */

async function uploadProductImage(file){

if(!file)
return null;


/* CREATE UNIQUE FILE NAME */

const extension =
file.name
.split(".")
.pop()
.toLowerCase();


const safeName =
file.name
.replace(/\.[^/.]+$/,"")
.toLowerCase()
.replace(/[^a-z0-9]+/g,"-")
.substring(0,50);


const uniqueName =
`${Date.now()}-${Math.random()
.toString(36)
.substring(2,8)}-${safeName}.${extension}`;


/* FOLDER */

const filePath =
`products/${uniqueName}`;


/* UPLOAD */

const {error} =
await supabaseClient
.storage
.from(STORAGE_BUCKET)
.upload(
filePath,
file,
{
cacheControl:"3600",
upsert:false,
contentType:file.type
}
);


if(error){

console.error(
"Image upload error:",
error
);

throw new Error(
"Failed to upload image: " +
error.message
);

}


/* GET PUBLIC URL */

const {data} =
supabaseClient
.storage
.from(STORAGE_BUCKET)
.getPublicUrl(filePath);


if(!data || !data.publicUrl){

throw new Error(
"Could not create public image URL."
);

}


return data.publicUrl;

}


/* =========================================
   SAVE PRODUCT
========================================= */

async function saveProduct(){

const saveButton =
document.getElementById("saveButton");


/* FORM VALUES */

const name =
document.getElementById("productName")
.value.trim();


const category =
document.getElementById("productCategory")
.value.trim();


const description =
document.getElementById("productDescription")
.value.trim();


const price =
Number(
document.getElementById("productPrice")
.value
);


const stock =
Number(
document.getElementById("productStock")
.value
);


const is_active =
document.getElementById("productActive")
.value === "true";


const imageFile =
document.getElementById("productImage")
.files[0];

){

);

stock,

is_active

.eq("id",editingId);

);

alert(

);

}


/* =====================================

===================================== */

else{

null;

);

stock,

/* =========================================
   DELETE PRODUCT
========================================= */

async function deleteProduct(id){

const product =
products.find(
p =>
Number(p.id) ===
Number(id)
);

if(!product)
return;


const confirmed =
confirm(
`Delete "${product.name}"?`
);


if(!confirmed)
return;


try{

const {error} =
await supabaseClient
.from("products")
.delete()
.eq("id",id);


if(error){

throw new Error(
error.message
);

}


alert(
"Product deleted successfully!"
);


await loadProducts();

}

catch(error){

console.error(error);

alert(
"Failed to delete product:\n\n" +
error.message
);

}

}


/* =========================================
   CLEAR FORM
========================================= */

function clearForm(){

document.getElementById("productName")
.value = "";


document.getElementById("productCategory")
.value = "";


document.getElementById("productDescription")
.value = "";


document.getElementById("productPrice")
.value = "";


document.getElementById("productStock")
.value = "0";


document.getElementById("productImage")
.value = "";


document.getElementById("productActive")
.value = "true";


document.getElementById("currentImage")
.style.display =
"none";


document.getElementById("imagePreview")
.style.display =
"none";

}


/* =========================================
   CLOSE MODAL
========================================= */

function closeModal(){

document.getElementById("productModal")
.style.display =
"none";

}


/* =========================================
   CLOSE MODAL BY CLICKING OUTSIDE
========================================= */

window.onclick =
function(event){

const modal =
document.getElementById("productModal");

if(event.target === modal){

closeModal();

}

};


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value){

if(
value === null ||
value === undefined
){

return "";

}


return String(value)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


/* =========================================
   START
========================================= */

loadProducts();
