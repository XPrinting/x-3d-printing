<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>X3D Printing | Products</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg:#080816;
    --surface:#11172a;
    --surface2:#0b1020;
    --border:rgba(255,255,255,.10);
    --text:#fff;
    --muted:#aeb6cc;
    --primary:#8b5cf6;
    --green:#22c55e;
    --red:#ef4444;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(
            circle at top right,
            #17153b 0%,
            #080816 45%
        ),
        var(--bg);
    color:var(--text);
    min-height:100vh;
}


/* =========================
   SIDEBAR
========================= */

.sidebar{
    position:fixed;
    left:0;
    top:0;
    width:250px;
    height:100vh;
    background:rgba(10,12,28,.96);
    border-right:1px solid var(--border);
    padding:25px 18px;
    z-index:100;
}

.logo{
    font-size:25px;
    font-weight:800;
    padding:10px 12px 30px;
}

.logo span{
    color:var(--primary);
}

.menu-title{
    color:#68728a;
    font-size:11px;
    font-weight:bold;
    text-transform:uppercase;
    padding:0 12px;
    margin-bottom:10px;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.menu-item{
    display:flex;
    align-items:center;
    gap:12px;
    color:var(--muted);
    padding:13px 14px;
    border-radius:11px;
    cursor:pointer;
    transition:.2s;
    text-decoration:none;
}

.menu-item:hover,
.menu-item.active{
    background:rgba(139,92,246,.16);
    color:#fff;
}

.menu-item.active{
    border-left:3px solid var(--primary);
}

.menu-icon{
    width:24px;
    text-align:center;
}


/* =========================
   MAIN
========================= */

.main{
    margin-left:250px;
    padding:30px 35px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
    gap:20px;
}

.page-title h1{
    font-size:30px;
    margin-bottom:7px;
}

.page-title p{
    color:var(--muted);
}

.add-btn{
    border:1px solid rgba(139,92,246,.4);
    background:
        linear-gradient(
            135deg,
            #5b21b6,
            #8b5cf6
        );
    color:#fff;
    padding:12px 18px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}


/* =========================
   STATS
========================= */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
    margin-bottom:25px;
}

.stat-card{
    background:rgba(17,23,42,.92);
    border:1px solid var(--border);
    border-radius:17px;
    padding:20px;
}

.stat-label{
    color:var(--muted);
    font-size:13px;
    margin-bottom:10px;
}

.stat-value{
    font-size:28px;
    font-weight:bold;
}


/* =========================
   PRODUCTS
========================= */

.products-card{
    background:rgba(17,23,42,.92);
    border:1px solid var(--border);
    border-radius:20px;
    overflow:hidden;
}

.products-header{
    padding:22px;
    border-bottom:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.products-header h2{
    font-size:21px;
}

.search{
    background:#0b1020;
    border:1px solid var(--border);
    color:#fff;
    padding:11px 14px;
    border-radius:9px;
    outline:none;
    width:260px;
}

.search:focus{
    border-color:var(--primary);
}

.table-wrapper{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:1000px;
}

th{
    text-align:left;
    color:#7f89a3;
    font-size:12px;
    text-transform:uppercase;
    padding:16px 20px;
    background:rgba(7,10,23,.45);
}

td{
    padding:15px 20px;
    border-top:1px solid var(--border);
}

tr:hover td{
    background:rgba(139,92,246,.04);
}


/* =========================
   PRODUCT IMAGE
========================= */

.product-image{
    width:65px;
    height:65px;
    border-radius:10px;
    object-fit:cover;
    background:#0b1020;
    border:1px solid var(--border);
    display:block;
}

.product-image-placeholder{
    width:65px;
    height:65px;
    border-radius:10px;
    background:#0b1020;
    border:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#68728a;
    font-size:11px;
    text-align:center;
}


/* =========================
   PRODUCT INFO
========================= */

.product-name{
    font-weight:bold;
}

.product-description{
    color:var(--muted);
    font-size:12px;
    margin-top:4px;
    max-width:300px;
}

.price{
    font-weight:bold;
}

.stock{
    color:#aeb6cc;
}

.active{
    color:#4ade80;
    font-weight:bold;
}

.inactive{
    color:#f87171;
    font-weight:bold;
}


/* =========================
   BUTTONS
========================= */

.edit-btn,
.delete-btn{
    padding:7px 11px;
    border-radius:8px;
    cursor:pointer;
    font-size:12px;
}

.edit-btn{
    border:1px solid rgba(139,92,246,.35);
    background:rgba(139,92,246,.10);
    color:#c4b5fd;
}

.delete-btn{
    border:1px solid rgba(239,68,68,.3);
    background:rgba(239,68,68,.10);
    color:#f87171;
    margin-left:5px;
}


/* =========================
   LOADING
========================= */

.loading,
.empty,
.error{
    padding:50px;
    text-align:center;
    color:var(--muted);
}

.error{
    color:#f87171;
}


/* =========================
   MODAL
========================= */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    z-index:500;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal-box{
    width:100%;
    max-width:650px;
    max-height:90vh;
    overflow-y:auto;
    background:#11172a;
    border:1px solid var(--border);
    border-radius:20px;
    padding:25px;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.close{
    background:transparent;
    border:none;
    color:#fff;
    font-size:28px;
    cursor:pointer;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.form-group{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.form-group.full{
    grid-column:1/-1;
}

label{
    color:#aeb6cc;
    font-size:13px;
}

input,
textarea,
select{
    width:100%;
    background:#0b1020;
    border:1px solid var(--border);
    color:#fff;
    padding:12px;
    border-radius:9px;
    outline:none;
}

textarea{
    min-height:100px;
    resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
    border-color:var(--primary);
}

.save-btn{
    width:100%;
    margin-top:20px;
    padding:13px;
    border:none;
    border-radius:10px;
    background:
        linear-gradient(
            135deg,
            #6d28d9,
            #8b5cf6
        );
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}

.save-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}


/* =========================
   MOBILE
========================= */

@media(max-width:900px){

    .sidebar{
        position:relative;
        width:100%;
        height:auto;
        border-right:none;
        border-bottom:1px solid var(--border);
    }

    .main{
        margin-left:0;
        padding:22px 15px;
    }

    .menu{
        flex-direction:row;
        overflow-x:auto;
    }

    .menu-item{
        min-width:max-content;
    }

    .menu-title{
        display:none;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .topbar{
        flex-direction:column;
        align-items:flex-start;
    }

    .add-btn{
        width:100%;
    }

    .products-header{
        flex-direction:column;
        align-items:stretch;
    }

    .search{
        width:100%;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .form-group.full{
        grid-column:auto;
    }

}

</style>

</head>


<body>


<!-- =========================
     SIDEBAR
========================= -->

<aside class="sidebar">

    <div class="logo">
        X<span>3D</span> Admin
    </div>

    <div class="menu-title">
        Management
    </div>

    <div class="menu">

        <a class="menu-item"
           href="admin.html">

            <span class="menu-icon">📊</span>

            Dashboard

        </a>


        <a class="menu-item"
           href="orders.html">

            <span class="menu-icon">🛒</span>

            Orders

        </a>


        <a class="menu-item active"
           href="product.html">

            <span class="menu-icon">📦</span>

            Products

        </a>


        <a class="menu-item"
           href="#customers">

            <span class="menu-icon">👥</span>

            Customers

        </a>


        <a class="menu-item"
           href="#custom">

            <span class="menu-icon">🎨</span>

            Custom Requests

        </a>

    </div>

</aside>


<!-- =========================
     MAIN
========================= -->

<main class="main">


    <div class="topbar">

        <div class="page-title">

            <h1>
                Products
            </h1>

            <p>
                Manage X3D Printing products.
            </p>

        </div>


        <button
            class="add-btn"
            onclick="openAddModal()">

            + Add Product

        </button>

    </div>


    <!-- =========================
         STATS
    ========================= -->

    <section class="stats">


        <div class="stat-card">

            <div class="stat-label">
                Total Products
            </div>

            <div
                class="stat-value"
                id="totalProducts">

                0

            </div>

        </div>


        <div class="stat-card">

            <div class="stat-label">
                Active Products
            </div>

            <div
                class="stat-value"
                id="activeProducts">

                0

            </div>

        </div>


        <div class="stat-card">

            <div class="stat-label">
                Out of Stock
            </div>

            <div
                class="stat-value"
                id="outOfStock">

                0

            </div>

        </div>


    </section>


    <!-- =========================
         PRODUCTS TABLE
    ========================= -->

    <section class="products-card">


        <div class="products-header">

            <h2>
                All Products
            </h2>


            <input
                class="search"
                id="searchInput"
                placeholder="Search products..."
                oninput="renderProducts()">

        </div>


        <div
            class="table-wrapper"
            id="tableContainer">

            <div class="loading">
                Loading products...
            </div>

        </div>


    </section>

</main>


<!-- =========================
     MODAL
========================= -->

<div
    class="modal"
    id="productModal">


    <div class="modal-box">


        <div class="modal-header">

            <h2 id="modalTitle">
                Add Product
            </h2>


            <button
                class="close"
                onclick="closeModal()">

                ×

            </button>

        </div>


        <div class="form-grid">


            <!-- NAME -->

            <div class="form-group">

                <label>
                    Product Name
                </label>

                <input
                    id="productName"
                    placeholder="Example: Phone Stand">

            </div>


            <!-- CATEGORY -->

            <div class="form-group">

                <label>
                    Category
                </label>

                <input
                    id="productCategory"
                    placeholder="Example: Accessories">

            </div>


            <!-- DESCRIPTION -->

            <div class="form-group full">

                <label>
                    Description
                </label>

                <textarea
                    id="productDescription"
                    placeholder="Product description..."></textarea>

            </div>


            <!-- PRICE -->

            <div class="form-group">

                <label>
                    Price (EGP)
                </label>

                <input
                    id="productPrice"
                    type="number"
                    step="0.01"
                    placeholder="250">

            </div>


            <!-- STOCK -->

            <div class="form-group">

                <label>
                    Stock
                </label>

                <input
                    id="productStock"
                    type="number"
                    min="0"
                    placeholder="10"
                    value="0">

            </div>


            <!-- IMAGE -->

            <div class="form-group full">

                <label>
                    Product Image
                </label>

                <input
                    id="productImage"
                    type="file"
                    accept="image/*">


                <div
                    id="currentImageText"
                    style="
                        color:#8f9ab3;
                        font-size:12px;
                        margin-top:3px;
                    ">
                </div>

            </div>


            <!-- STATUS -->

            <div class="form-group">

                <label>
                    Status
                </label>

                <select id="productStatus">

                    <option value="active">
                        Active

                    <option value="inactive">
                        Inactive
                    </option>

                </select>

            </div>


        </div>


        <button
            class="save-btn"
            id="saveButton"
            onclick="saveProduct()">

            Save Product

        </button>


    </div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://wxezuqdktbftlkjxqcmi.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_Z1_vjXxFAUU_PAI05Hqd4w_zjopEwwH";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =====================================================
   GITHUB
===================================================== */

const GITHUB_RAW_BASE =
    "https://raw.githubusercontent.com/ahmedramadansadek1112-collab/x-3d-printing/main";


/* =====================================================
   STORAGE
===================================================== */

const PRODUCT_BUCKET =
    "product-images";


/* =====================================================
   GLOBAL
===================================================== */

let products = [];

let editingId = null;


/* =====================================================
   PRODUCT IMAGE MAP
===================================================== */

const PRODUCT_IMAGES = {

    "custom name keychain":
        "01-custom-name-keychain.jpeg",

    "custom name":
        "01-custom-name-keychain.jpeg",

    "01 custom name keychain":
        "01-custom-name-keychain.jpeg",


    "football keychain":
        "03-football-keychain.jpeg",

    "03 football keychain":
        "03-football-keychain.jpeg",


    "fighter jets set of 2":
        "02-fighter-jet-1.jpeg",

    "fighter jets":
        "02-fighter-jet-1.jpeg",

    "fighter jet":
        "02-fighter-jet-1.jpeg",


    "knife":
        "04-knife-1.jpeg"

};


/* =====================================================
   NORMALIZE TEXT
===================================================== */

function normalizeText(value){

    return String(value || "")
        .toLowerCase()
        .trim()
        .replace(/[_-]+/g," ")
        .replace(/\s+/g," ");

}


/* =====================================================
   GITHUB IMAGE
===================================================== */

function getGithubImageUrl(product){

    if(!product){
        return "";
    }


    const name =
        normalizeText(product.name);


    let databaseImage =
        String(
            product.image || ""
        ).trim();


    if(
        databaseImage.startsWith("http://") ||
        databaseImage.startsWith("https://")
    ){

        return databaseImage;

    }


    if(databaseImage){

        databaseImage =
            databaseImage
                .split("/")
                .pop()
                .trim();


        const knownFiles = [

            "01-custom-name-keychain.jpeg",

            "02-fighter-jet-1.jpeg",

            "02-fighter-jet-2.jpeg",

            "03-football-keychain.jpeg",

            "04-knife-1.jpeg",

            "04-knife-2.jpeg"

        ];


        if(
            knownFiles.includes(databaseImage)
        ){

            return (
                GITHUB_RAW_BASE +
                "/" +
                encodeURIComponent(
                    databaseImage
                )
            );

        }

    }


    if(
        PRODUCT_IMAGES[name]
    ){

        return (
            GITHUB_RAW_BASE +
            "/" +
            encodeURIComponent(
                PRODUCT_IMAGES[name]
            )
        );

    }


    if(
        name.includes("custom") &&
        name.includes("keychain")
    ){

        return (
            GITHUB_RAW_BASE +
            "/01-custom-name-keychain.jpeg"
        );

    }


    if(
        name.includes("football") &&
        name.includes("keychain")
    ){

        return (
            GITHUB_RAW_BASE +
            "/03-football-keychain.jpeg"
        );

    }


    if(
        name.includes("fighter") &&
        name.includes("jet")
    ){

        return (
            GITHUB_RAW_BASE +
            "/02-fighter-jet-1.jpeg"
        );

    }


    if(
        name.includes("knife")
    ){

        return (
            GITHUB_RAW_BASE +
            "/04-knife-1.jpeg"
        );

    }


    return "";

}


/* =====================================================
   IMAGE URL
===================================================== */

function getProductImageUrl(product){

    if(!product){
        return "";
    }


    const image =
        String(
            product.image || ""
        ).trim();


    if(
        image.startsWith("http://") ||
        image.startsWith("https://")
    ){

        return image;

    }


    const githubImage =
        getGithubImageUrl(product);


    if(githubImage){

        return githubImage;

    }


    if(image){

        try{

            const {
                data
            } =
                supabaseClient
                    .storage
                    .from(PRODUCT_BUCKET)
                    .getPublicUrl(image);


            if(
                data &&
                data.publicUrl
            ){

                return data.publicUrl;

            }

        }

        catch(error){

            console.error(
                "Storage image error:",
                error
            );

        }

    }


    return "";

}


/* =====================================================
   LOAD PRODUCTS
===================================================== */

async function loadProducts(){

    const container =
        document.getElementById(
            "tableContainer"
        );


    container.innerHTML = `
        <div class="loading">
            Loading products...
        </div>
    `;


    try{

        const {
            data,
            error
        } =
            await supabaseClient
                .from("products")
                .select("*")
                .order(
                    "id",
                    {
                        ascending:false
                    }
                );


        if(error){

            console.error(error);


            container.innerHTML = `
                <div class="error">

                    ❌ Failed to load products.

                    <br><br>

                    ${escapeHtml(
                        error.message
                    )}

                </div>
            `;


            return;

        }


        products =
            data || [];


        updateStats();

        renderProducts();


    }

    catch(error){

        console.error(error);


        container.innerHTML = `
            <div class="error">

                ❌ Something went wrong.

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>
        `;

    }

}


/* =====================================================
   STATS
===================================================== */

function updateStats(){

    document.getElementById(
        "totalProducts"
    ).textContent =
        products.length;


    document.getElementById(
        "activeProducts"
    ).textContent =
        products.filter(
            p =>
                Number(
                    p.stock || 0
                ) > 0
        ).length;


    document.getElementById(
        "outOfStock"
    ).textContent =
        products.filter(
            p =>
                Number(
                    p.stock || 0
                ) <= 0
        ).length;

}


/* =====================================================
   RENDER PRODUCTS
===================================================== */

function renderProducts(){

    const container =
        document.getElementById(
            "tableContainer"
        );


    const searchInput =
        document.getElementById(
            "searchInput"
        );


    const search =
        searchInput
        ?
        searchInput.value
            .toLowerCase()
            .trim()
        :
        "";


    let filtered =
        [...products];


    if(search){

        filtered =
            filtered.filter(
                product => {

                    const name =
                        String(
                            product.name || ""
                        )
                        .toLowerCase();


                    const category =
                        String(
                            product.category || ""
                        )
                        .toLowerCase();


                    const description =
                        String(
                            product.description || ""
                        )
                        .toLowerCase();


                    return (

                        name.includes(search) ||

                        category.includes(search) ||

                        description.includes(search)

                    );

                }
            );

    }


    if(!filtered.length){

        container.innerHTML = `
            <div class="empty">
                No products found.
            </div>
        `;

        return;

    }


    container.innerHTML = `

        <table>

            <thead>

                <tr>

                    <th>Image</th>

                    <th>Product</th>

                    <th>Category</th>

                    <th>Price</th>

                    <th>Stock</th>

                    <th>Status</th>

                    <th>Actions</th>

                </tr>

            </thead>


            <tbody>

                ${
                    filtered
                        .map(
                            product => {

                                const imageUrl =
                                    getProductImageUrl(
                                        product
                                    );


                                const stock =
                                    Number(
                                        product.stock || 0
                                    );


                                const isActive =
                                    stock > 0;


                                return `

                                    <tr>

                                        <td>

                                            ${
                                                imageUrl
                                                ?
                                                `
                                                    <img
                                                        class="product-image"
                                                        src="${escapeHtml(imageUrl)}"
                                                        alt="${escapeHtml(
                                                            product.name ||
                                                            "Product"
                                                        )}"
                                                        onerror="handleImageError(this)"
                                                    >
                                                `
                                                :
                                                `
                                                    <div class="product-image-placeholder">
                                                        No Image
                                                    </div>
                                                `
                                            }

                                        </td>


                                        <td>

                                            <div class="product-name">

                                                ${escapeHtml(
                                                    product.name ||
                                                    "-"
                                                )}

                                            </div>


                                            <div class="product-description">

                                                ${escapeHtml(
                                                    product.description ||
                                                    ""
                                                )}

                                            </div>

                                        </td>


                                        <td>

                                            ${escapeHtml(
                                                product.category ||
                                                "-"
                                            )}

                                        </td>


                                        <td>

                                            <span class="price">

                                                EGP ${Number(
                                                    product.price || 0
                                                ).toLocaleString()}

                                            </span>

                                        </td>


                                        <td>

                                            <span class="stock">

                                                ${escapeHtml(
                                                    product.stock ??
                                                    0
                                                )}

                                            </span>

                                        </td>


                                        <td>

                                            ${
                                                isActive
                                                ?
                                                `
                                                    <span class="active">
                                                        Active
                                                    </span>
                                                `
                                                :
                                                `
                                                    <span class="inactive">
                                                        Out of Stock
                                                    </span>
                                                `
                                            }

                                        </td>


                                        <td>

                                            <button
                                                class="edit-btn"
                                                onclick="editProduct(${Number(
                                                    product.id
                                                )})">

                                                Edit

                                            </button>


                                            <button
                                                class="delete-btn"
                                                onclick="deleteProduct(${Number(
                                                    product.id
                                                )})">

                                                Delete

                                            </button>

                                        </td>

                                    </tr>

                                `;

                            }
                        )
                        .join("")
                }

            </tbody>

        </table>

    `;

}

/* =====================================================
   EDIT PRODUCT
===================================================== */

function editProduct(id){

    const product =
        products.find(
            p =>
                Number(p.id) ===
                Number(id)
        );


    if(!product){

        alert(
            "Product not found."
        );

        return;

    }


    editingId =
        product.id;


    document.getElementById(
        "modalTitle"
    ).textContent =
        "Edit Product";


    document.getElementById(
        "productName"
    ).value =
        product.name || "";


    document.getElementById(
        "productCategory"
    ).value =
        product.category || "";


    document.getElementById(
        "productDescription"
    ).value =
        product.description || "";


    document.getElementById(
        "productPrice"
    ).value =
        product.price || "";


    document.getElementById(
        "productStock"
    ).value =
        product.stock ?? 0;


    document.getElementById(
        "productImage"
    ).value =
        "";


    document.getElementById(
        "productStatus"
    ).value =
        Number(
            product.stock || 0
        ) > 0
        ?
        "active"
        :
        "inactive";


    const currentImageText =
        document.getElementById(
            "currentImageText"
        );


    const currentImage =
        getProductImageUrl(
            product
        );


    if(currentImage){

        currentImageText.innerHTML = `

            Current image:

            <br>

            <span style="
                word-break:break-all;
            ">

                ${escapeHtml(
                    currentImage
                )}

            </span>

            <br><br>

            Choose a new image only if you want
            to replace the current image.

        `;

    }

    else{

        currentImageText.textContent =
            "No current image.";

    }


    document.getElementById(
        "productModal"
    ).style.display =
        "flex";

}


/* =====================================================
   UPLOAD IMAGE
===================================================== */

async function uploadProductImage(file){

    if(!file)
        return null;


    const extension =
        file.name
            .split(".")
            .pop()
            .toLowerCase();


    const safeName =
        file.name
            .replace(
                /\.[^/.]+$/,
                ""
            )
            .replace(
                /[^a-zA-Z0-9-_]/g,
                "-"
            )
            .toLowerCase();


    const fileName =
        `${Date.now()}-${safeName}.${extension}`;


    const filePath =
        `images/${fileName}`;


    const {
        error
    } =
        await supabaseClient
            .storage
            .from(
                PRODUCT_BUCKET
            )
            .upload(
                filePath,
                file,
                {
                    cacheControl:
                        "3600",

                    upsert:
                        false
                }
            );


    if(error){

        throw error;

    }


    return filePath;

}


/* =====================================================
   SAVE PRODUCT
   UPDATED
===================================================== */

async function saveProduct(){

    const saveButton =
        document.getElementById(
            "saveButton"
        );


    const name =
        document.getElementById(
            "productName"
        )
        .value
        .trim();


    const category =
        document.getElementById(
            "productCategory"
        )
        .value
        .trim();


    const description =
        document.getElementById(
            "productDescription"
        )
        .value
        .trim();


    const price =
        Number(
            document.getElementById(
                "productPrice"
            ).value
        );


    const stock =
        Number(
            document.getElementById(
                "productStock"
            ).value
        );


    const imageFile =
        document.getElementById(
            "productImage"
        )
        .files[0];


    /* =========================
       VALIDATION
    ========================= */

    if(!name){

        alert(
            "Please enter product name."
        );

        return;

    }


    if(
        !Number.isFinite(price) ||
        price < 0
    ){

        alert(
            "Please enter a valid price."
        );

        return;

    }


    if(
        !Number.isFinite(stock) ||
        stock < 0
    ){

        alert(
            "Please enter a valid stock."
        );

        return;

    }


    try{

        saveButton.disabled = true;

        saveButton.textContent =
            "Saving...";


        /* =========================
           EXISTING IMAGE
        ========================= */

        let imagePath = null;


        if(editingId){

            const existingProduct =
                products.find(
                    p =>
                        Number(p.id) ===
                        Number(editingId)
                );


            if(existingProduct){

                imagePath =
                    existingProduct.image ||
                    null;

            }

        }


        /* =========================
           UPLOAD NEW IMAGE
        ========================= */

        if(imageFile){

            imagePath =
                await uploadProductImage(
                    imageFile
                );

        }


        /* =========================
           DATA WITH STOCK
        ========================= */

        const productDataWithStock = {

            name:
                name,

            description:
                description,

            category:
                category,

            price:
                price,

            stock:
                stock,

            image:
                imagePath

        };


        /* =========================
           DATA WITHOUT STOCK
        ========================= */

        const productDataWithoutStock = {

            name:
                name,

            description:
                description,

            category:
                category,

            price:
                price,

            image:
                imagePath

        };


        let result;


        /* =========================
           UPDATE
        ========================= */

        if(editingId){

            result =
                await supabaseClient
                    .from("products")
                    .update(
                        productDataWithStock
                    )
                    .eq(
                        "id",
                        editingId
                    );


            /*
                FALLBACK:
                If stock does not exist
                in Supabase, retry without it.
            */

            if(
                result.error &&
                (
                    result.error.message
                        .toLowerCase()
                        .includes("stock") ||

                    result.error.message
                        .toLowerCase()
                        .includes("schema cache")
                )
            ){

                console.warn(
                    "Stock column not found. Retrying without stock..."
                );


                result =
                    await supabaseClient
                        .from("products")
                        .update(
                            productDataWithoutStock
                        )
                        .eq(
                            "id",
                            editingId
                        );

            }

        }


        /* =========================
           INSERT
        ========================= */

        else{

            result =
                await supabaseClient
                    .from("products")
                    .insert(
                        productDataWithStock
                    );


            /*
                FALLBACK:
                If stock does not exist
                in Supabase, retry without it.
            */

            if(
                result.error &&
                (
                    result.error.message
                        .toLowerCase()
                        .includes("stock") ||

                    result.error.message
                        .toLowerCase()
                        .includes("schema cache")
                )
            ){

                console.warn(
                    "Stock column not found. Retrying without stock..."
                );


                result =
                    await supabaseClient
                        .from("products")
                        .insert(
                            productDataWithoutStock
                        );

            }

        }


        /* =========================
           FINAL ERROR
        ========================= */

        if(result.error){

            console.error(
                "Supabase save error:",
                result.error
            );


            alert(
                "Failed to save product:\n\n" +
                result.error.message
            );


            return;

        }


        /* =========================
           SUCCESS
        ========================= */

        alert(
            editingId
            ?
            "Product updated successfully!"
            :
            "Product added successfully!"
        );


        closeModal();


        await loadProducts();

    }

    catch(error){

        console.error(
            "Save product error:",
            error
        );


        alert(
            "Something went wrong:\n\n" +
            error.message
        );

    }

    finally{

        saveButton.disabled = false;

        saveButton.textContent =
            "Save Product";

    }

}


/* =====================================================
   DELETE PRODUCT
===================================================== */

async function deleteProduct(id){

    const product =
        products.find(
            p =>
                Number(p.id) ===
                Number(id)
        );


    if(!product){

        return;

    }


    const confirmed =
        confirm(
            `Delete "${product.name}"?`
        );


    if(!confirmed){

        return;

    }


    try{

        const {
            error
        } =
            await supabaseClient
                .from("products")
                .delete()
                .eq(
                    "id",
                    id
                );


        if(error){

            console.error(error);


            alert(
                "Failed to delete product:\n\n" +
                error.message
            );


            return;

        }


        alert(
            "Product deleted successfully!"
        );


        await loadProducts();

    }

    catch(error){

        console.error(error);


        alert(
            "Something went wrong:\n\n" +
            error.message
        );

    }

}

/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
