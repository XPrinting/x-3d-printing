<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>X3D Printing | Admin Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #080816;
            --surface: #11172a;
            --surface2: #171f38;
            --border: rgba(255,255,255,.10);
            --text: #ffffff;
            --muted: #aeb6cc;
            --primary: #8b5cf6;
            --primary2: #6d28d9;
            --green: #22c55e;
            --orange: #f59e0b;
            --red: #ef4444;
            --blue: #3b82f6;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at top right, #17153b 0%, #080816 45%),
                var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* SIDEBAR */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 250px;
            height: 100vh;
            background: rgba(10, 12, 28, .96);
            border-right: 1px solid var(--border);
            padding: 25px 18px;
            z-index: 100;
        }

        .logo {
            font-size: 25px;
            font-weight: 800;
            padding: 10px 12px 30px;
        }

        .logo span {
            color: var(--primary);
        }

        .menu-title {
            color: #68728a;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            padding: 0 12px;
            margin-bottom: 10px;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--muted);
            padding: 13px 14px;
            border-radius: 11px;
            cursor: pointer;
            transition: .2s;
            text-decoration: none;
        }

        .menu-item:hover,
        .menu-item.active {
            background: rgba(139, 92, 246, .16);
            color: white;
        }

        .menu-item.active {
            border-left: 3px solid var(--primary);
        }

        .menu-icon {
            width: 24px;
            text-align: center;
        }

        /* MAIN */

        .main {
            margin-left: 250px;
            padding: 30px 35px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .page-title h1 {
            font-size: 30px;
            margin-bottom: 7px;
        }

        .page-title p {
            color: var(--muted);
        }

        .refresh-btn {
            border: 1px solid rgba(139,92,246,.4);
            background: linear-gradient(135deg, #5b21b6, #8b5cf6);
            color: white;
            padding: 11px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        .refresh-btn:hover {
            opacity: .85;
        }

        /* STATS */

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(17,23,42,.92);
            border: 1px solid var(--border);
            border-radius: 17px;
            padding: 22px;
            transition: .2s;
        }

        .stat-card:hover {
            border-color: rgba(139,92,246,.45);
            transform: translateY(-2px);
        }

        .stat-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .stat-label {
            color: var(--muted);
            font-size: 14px;
        }

        .stat-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 11px;
            background: rgba(139,92,246,.14);
            font-size: 19px;
        }

        .stat-value {
            font-size: 29px;
            font-weight: bold;
        }

        /* ORDERS CARD */

        .orders-card {
            background: rgba(17,23,42,.92);
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
        }

        .orders-header {
            padding: 22px;
            border-bottom: 1px solid var(--border);

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .orders-header h2 {
            font-size: 21px;
        }

        .orders-actions {
            display: flex;
            gap: 10px;
        }

        .search {
            background: #0b1020;
            border: 1px solid var(--border);
            color: white;
            padding: 10px 13px;
            border-radius: 9px;
            outline: none;
            width: 220px;
        }

        .search:focus {
            border-color: var(--primary);
        }

        .filter {
            background: #0b1020;
            border: 1px solid var(--border);
            color: white;
            padding: 10px 13px;
            border-radius: 9px;
            outline: none;
            cursor: pointer;
        }

        .filter option {
            background: #11172a;
        }

        /* TABLE */

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 950px;
        }

        th {
            text-align: left;
            color: #7f89a3;
            font-size: 12px;
            text-transform: uppercase;
            padding: 16px 20px;
            background: rgba(7,10,23,.45);
            white-space: nowrap;
        }

        td {
            padding: 17px 20px;
            border-top: 1px solid var(--border);
            white-space: nowrap;
        }

        tr:hover td {
            background: rgba(139,92,246,.04);
        }

        .order-id {
            color: #a78bfa;
            font-weight: bold;
        }

        .customer-name {
            font-weight: bold;
        }

        .customer-phone {
            color: var(--muted);
            font-size: 12px;
            margin-top: 4px;
        }

        .amount {
            font-weight: bold;
        }

        .status {
            display: inline-flex;
            align-items: center;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-new {
            background: rgba(59,130,246,.15);
            color: #60a5fa;
        }

        .status-confirmed {
            background: rgba(34,197,94,.15);
            color: #4ade80;
        }

        .status-preparing {
            background: rgba(245,158,11,.15);
            color: #fbbf24;
        }

        .status-delivered {
            background: rgba(139,92,246,.15);
            color: #a78bfa;
        }

        .status-cancelled {
            background: rgba(239,68,68,.15);
            color: #f87171;
        }

        .view-btn {
            border: 1px solid rgba(139,92,246,.35);
            background: rgba(139,92,246,.10);
            color: #c4b5fd;
            padding: 7px 11px;
            border-radius: 8px;
            cursor: pointer;
        }

        .view-btn:hover {
            background: rgba(139,92,246,.2);
        }

        /* EMPTY / LOADING */

        .loading,
        .empty {
            padding: 50px;
            text-align: center;
            color: var(--muted);
        }

        .error {
            padding: 25px;
            text-align: center;
            color: #f87171;
        }

        /* MODAL */

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.75);
            z-index: 500;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-box {
            width: 100%;
            max-width: 650px;
            max-height: 90vh;
            overflow-y: auto;
            background: #11172a;
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 25px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .modal-header h2 {
            font-size: 22px;
        }

        .close {
            background: transparent;
            border: none;
            color: white;
            font-size: 28px;
            cursor: pointer;
        }

        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .detail {
            background: #0b1020;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
        }

        .detail.full {
            grid-column: 1 / -1;
        }

        .detail-label {
            color: #7f89a3;
            font-size: 11px;
            text-transform: uppercase;
            margin-bottom: 7px;
        }

        .detail-value {
            color: white;
            word-break: break-word;
        }

        .status-control {
            margin-top: 20px;
        }

        .status-control label {
            display: block;
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 8px;
        }

        .status-select {
            width: 100%;
            background: #0b1020;
            border: 1px solid var(--border);
            color: white;
            padding: 12px;
            border-radius: 9px;
            outline: none;
        }

        .save-status {
            width: 100%;
            margin-top: 12px;
            padding: 12px;
            border: none;
            border-radius: 9px;
            background: linear-gradient(135deg, #6d28d9, #8b5cf6);
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        /* MOBILE */

        @media (max-width: 1100px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 800px) {

            .sidebar {
                position: relative;
                width: 100%;
                height: auto;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }

            .main {
                margin-left: 0;
                padding: 22px 15px;
            }

            .menu {
                flex-direction: row;
                overflow-x: auto;
            }

            .menu-item {
                min-width: max-content;
            }

            .menu-title {
                display: none;
            }

            .topbar {
                flex-direction: column;
                align-items: flex-start;
            }

            .orders-header {
                flex-direction: column;
                align-items: stretch;
            }

            .orders-actions {
                flex-direction: column;
            }

            .search {
                width: 100%;
            }
        }

        @media (max-width: 550px) {

            .stats {
                grid-template-columns: 1fr;
            }

            .details-grid {
                grid-template-columns: 1fr;
            }

            .detail.full {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

<!-- SIDEBAR -->

<aside class="sidebar">

    <div class="logo">
        X<span>3D</span> Admin
    </div>

    <div class="menu-title">
        Management
    </div>

    <div class="menu">

        <a class="menu-item active" href="admin.html">
            <span class="menu-icon">📊</span>
            Dashboard
        </a>

        <a class="menu-item" href="#orders">
            <span class="menu-icon">🛒</span>
            Orders
        </a>

        <a class="menu-item" href="products/products.htm">
            <span class="menu-icon">📦</span>
            Products
        </a>

        <a class="menu-item" href="#customers">
            <span class="menu-icon">👥</span>
            Customers
        </a>

        <a class="menu-item" href="#custom">
            <span class="menu-icon">🎨</span>
            Custom Requests
        </a>

        <a class="menu-item" href="#settings">
            <span class="menu-icon">⚙️</span>
            Settings
        </a>

    </div>

</aside>


<!-- MAIN -->

<main class="main">

    <div class="topbar">

        <div class="page-title">

            <h1>
                Dashboard
            </h1>

            <p>
                Welcome back. Here's what's happening with your store.
            </p>

        </div>

        <button
            class="refresh-btn"
            onclick="loadOrders()"
        >
            ↻ Refresh
        </button>

    </div>


    <!-- STATS -->

    <section class="stats">

        <div class="stat-card">

            <div class="stat-top">

                <span class="stat-label">
                    Total Orders
                </span>

                <div class="stat-icon">
                    🛒
                </div>

            </div>

            <div
                class="stat-value"
                id="totalOrders"
            >
                0
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-top">

                <span class="stat-label">
                    New Orders
                </span>

                <div class="stat-icon">
                    🆕
                </div>

            </div>

            <div
                class="stat-value"
                id="newOrders"
            >
                0
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-top">

                <span class="stat-label">
                    Total Sales
                </span>

                <div class="stat-icon">
                    💰
                </div>

            </div>

            <div
                class="stat-value"
                id="totalSales"
            >
                EGP 0
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-top">

                <span class="stat-label">
                    Customers
                </span>

                <div class="stat-icon">
                    👥
                </div>

            </div>

            <div
                class="stat-value"
                id="totalCustomers"
            >
                0
            </div>

        </div>

    </section>


    <!-- ORDERS -->

    <section
        class="orders-card"
        id="orders"
    >

        <div class="orders-header">

            <h2>
                Recent Orders
            </h2>

            <div class="orders-actions">

                <input
                    type="text"
                    class="search"
                    id="searchInput"
                    placeholder="Search customer or phone..."
                    oninput="renderOrders()"
                >

                <select
                    class="filter"
                    id="statusFilter"
                    onchange="renderOrders()"
                >

                    <option value="all">
                        All Status
                    </option>

                    <option value="new">
                        New
                    </option>

                    <option value="confirmed">
                        Confirmed
                    </option>

                    <option value="preparing">
                        Preparing
                    </option>

                    <option value="delivered">
                        Delivered
                    </option>

                    <option value="cancelled">
                        Cancelled
                    </option>

                </select>

            </div>

        </div>


        <div
            class="table-wrapper"
            id="tableContainer"
        >

            <div class="loading">
                Loading orders...
            </div>

        </div>

    </section>

</main>


<!-- DETAILS MODAL -->

<div
    class="modal"
    id="detailsModal"
>

    <div class="modal-box">

        <div class="modal-header">

            <h2>
                Order Details
            </h2>

            <button
                class="close"
                onclick="closeModal()"
            >
                ×
            </button>

        </div>

        <div
            class="details-grid"
            id="detailsContent"
        >
        </div>

    </div>

</div>


<script>

/* =========================================================
   SUPABASE CONFIG
   ========================================================= */

/*
   PUT YOUR SUPABASE PROJECT URL HERE
*/

const SUPABASE_URL =
    "https://wxezuqdktbftlkjxqcmi.supabase.co";


/*
   PUT YOUR SUPABASE PUBLISHABLE KEY HERE
*/

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_Z1_vjXxFAUU_PAI05Hqd4w_zjopEwwH";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =========================================================
   GLOBAL DATA
   ========================================================= */

let orders = [];

let selectedOrder = null;


/* =========================================================
   LOAD ORDERS
   ========================================================= */

async function loadOrders() {

    const tableContainer =
        document.getElementById("tableContainer");

    tableContainer.innerHTML = `
        <div class="loading">
            Loading orders...
        </div>
    `;

    try {

        const { data, error } =
            await supabaseClient
                .from("orders")
                .select("*")
                .order("id", {
                    ascending: false
                });

        if (error) {

            console.error(error);

            tableContainer.innerHTML = `
                <div class="error">
                    ❌ Failed to load orders.<br><br>
                    ${escapeHtml(error.message)}
                </div>
            `;

            return;
        }

        orders = data || [];

        updateStats();

        renderOrders();

    } catch (error) {

        console.error(error);

        tableContainer.innerHTML = `
            <div class="error">
                ❌ Something went wrong.<br><br>
                ${escapeHtml(error.message)}
            </div>
        `;

    }

}


/* =========================================================
   STATS
   ========================================================= */

function updateStats() {

    const total =
        orders.length;

    const newOrders =
        orders.filter(order =>
            normalizeStatus(order.status) === "new"
        ).length;

    const sales =
        orders.reduce((sum, order) => {

            const value =
                Number(
                    order.total ??
                    order.total_price ??
                    order.price ??
                    0
                );

            return sum + value;

        }, 0);


    const customers =
        new Set(
            orders
                .map(order => order.phone)
                .filter(Boolean)
        ).size;


    document.getElementById("totalOrders")
        .textContent = total;

    document.getElementById("newOrders")
        .textContent = newOrders;

    document.getElementById("totalSales")
        .textContent =
        "EGP " +
        sales.toLocaleString();

    document.getElementById("totalCustomers")
        .textContent = customers;

}


/* =========================================================
   RENDER ORDERS
   ========================================================= */

function renderOrders() {

    const container =
        document.getElementById("tableContainer");

    const search =
        document.getElementById("searchInput")
            .value
            .toLowerCase()
            .trim();

    const status =
        document.getElementById("statusFilter")
            .value;


    let filtered =
        [...orders];


    if (search) {

        filtered =
            filtered.filter(order => {

                const name =
                    String(
                        order.customer_name || ""
                    ).toLowerCase();

                const phone =
                    String(
                        order.phone || ""
                    ).toLowerCase();

                const governorate =
                    String(
                        order.governorate || ""
                    ).toLowerCase();

                const area =
                    String(
                        order.area || ""
                    ).toLowerCase();

                return (
                    name.includes(search) ||
                    phone.includes(search) ||
                    governorate.includes(search) ||
                    area.includes(search)
                );

            });

    }


    if (status !== "all") {

        filtered =
            filtered.filter(order =>
                normalizeStatus(order.status) === status
            );

    }


    if (filtered.length === 0) {

        container.innerHTML = `
            <div class="empty">
                No orders found.
            </div>
        `;

        return;

    }


    container.innerHTML = `

        <table>

            <thead>

                <tr>

                    <th>
                        Order
                    </th>

                    <th>
                        Customer
                    </th>

                    <th>
                        Location
                    </th>

                    <th>
                        Product
                    </th>

                    <th>
                        Quantity
                    </th>

                    <th>
                        Color
                    </th>

                    <th>
                        Total
                    </th>

                    <th>
                        Status
                    </th>

                    <th>
                        Action
                    </th>

                </tr>

            </thead>

            <tbody>

                ${filtered.map(order => {

                    return `

                        <tr>

                            <td>
                                <span class="order-id">
                                    #${escapeHtml(order.id)}
                                </span>
                            </td>

                            <td>

                                <div class="customer-name">
                                    ${escapeHtml(
                                        order.customer_name ||
                                        "Unknown"
                                    )}
                                </div>

                                <div class="customer-phone">
                                    ${escapeHtml(
                                        order.phone ||
                                        "-"
                                    )}
                                </div>

                            </td>

                            <td>
                                ${escapeHtml(
                                    [
                                        order.governorate,
                                        order.area
                                    ]
                                    .filter(Boolean)
                                    .join(" - ") || "-"
                                )}
                            </td>

                            <td>
                                ${escapeHtml(
                                    order.product_name ||
                                    order.product ||
                                    order.product_id ||
                                    "-"
                                )}
                            </td>

                            <td>
                                ${escapeHtml(
                                    order.quantity ??
                                    1
                                )}
                            </td>

                            <td>
                                ${escapeHtml(
                                    getColor(order)
                                )}
                            </td>

                            <td>

                                <span class="amount">
                                    EGP ${escapeHtml(
                                        getOrderTotal(order)
                                    )}
                                </span>

                            </td>

                            <td>
                                ${statusBadge(order.status)}
                            </td>

                            <td>

                                <button
                                    class="view-btn"
                                    onclick="viewOrder(${Number(order.id)})"
                                >
                                    View
                                </button>

                            </td>

                        </tr>

                    `;

                }).join("")}

            </tbody>

        </table>

    `;

}


/* =========================================================
   VIEW ORDER
   ========================================================= */

function viewOrder(id) {

    selectedOrder =
        orders.find(
            order => Number(order.id) === Number(id)
        );


    if (!selectedOrder) {
        return;
    }


    const order =
        selectedOrder;


    const details =
        document.getElementById("detailsContent");


    details.innerHTML = `

        <div class="detail">

            <div class="detail-label">
                Order ID
            </div>

            <div class="detail-value">
                #${escapeHtml(order.id)}
            </div>

        </div>


        <div class="detail">

            <div class="detail-label">
                Customer
            </div>

            <div class="detail-value">
                ${escapeHtml(
                    order.customer_name || "-"
                )}
            </div>

        </div>


        <div class="detail">

            <div class="detail-label">
                Phone
            </div>

            <div class="detail-value">
                ${escapeHtml(
                    order.phone || "-"
                )}
            </div>

        </div>


        <div class="detail">

            <div class="detail-label">
                Product
            </div>

            <div class="detail-value">
                ${escapeHtml(
                    order.product_name ||
                    order.product ||
                    order.product_id ||
                    "-"
                )}
            </div>

        </div>


        <div class="detail">

            <div class="detail-label">
                Quantity
            </div>

            <div class="detail-value">
                ${escapeHtml(
                    order.quantity ?? 1
                )}
            </div>

        </div>


        <div class="detail">

            <div class="detail-label">
                Color
            </div>

            <div class="detail-value">
                ${escapeHtml(
                    getColor(order)
                )}
            </div>

        </div>


        <div class="detail">

            <div class="detail-label">
                Total
            </div>

            <div class="detail-value">
                EGP ${escapeHtml(
                    getOrderTotal(order)
                )}
            </div>

        </div>


        <div class="detail">

            <div class="detail-label">
                Payment
            </div>

            <div class="detail-value">
                ${escapeHtml(
                    order.payment_method ||
                    "-"
                )}
            </div>

        </div>


        <div class="detail full">

            <div class="detail-label">
                Address
            </div>

            <div class="detail-value">
                ${escapeHtml(
                    [
                        order.governorate,
                        order.area,
                        order.address
                    ]
                    .filter(Boolean)
                    .join(" - ") || "-"
                )}
            </div>

        </div>


        <div class="detail full">

            <div class="detail-label">
                Created At
            </div>

            <div class="detail-value">
                ${formatDate(
                    order.created_at
                )}
            </div>

        </div>


        <div class="status-control detail full">

            <label>
                Order Status
            </label>

            <select
                class="status-select"
                id="orderStatus"
            >

                <option value="new"
                    ${normalizeStatus(order.status) === "new" ? "selected" : ""}>
                    New
                </option>

                <option value="confirmed"
                    ${normalizeStatus(order.status) === "confirmed" ? "selected" : ""}>
                    Confirmed
                </option>

                <option value="preparing"
                    ${normalizeStatus(order.status) === "preparing" ? "selected" : ""}>
                    Preparing
                </option>

                <option value="delivered"
                    ${normalizeStatus(order.status) === "delivered" ? "selected" : ""}>
                    Delivered
                </option>

                <option value="cancelled"
                    ${normalizeStatus(order.status) === "cancelled" ? "selected" : ""}>
                    Cancelled
                </option>

            </select>

            <button
                class="save-status"
                onclick="updateOrderStatus()"
            >
                Save Status
            </button>

        </div>

    `;


    document.getElementById("detailsModal")
        .style.display = "flex";

}


/* =========================================================
   UPDATE STATUS
   ========================================================= */

async function updateOrderStatus() {

    if (!selectedOrder) {
        return;
    }


    const newStatus =
        document.getElementById("orderStatus")
            .value;


    const { error } =
        await supabaseClient
            .from("orders")
            .update({
                status: newStatus
            })
            .eq("id", selectedOrder.id);


    if (error) {

        alert(
            "Failed to update status:\n" +
            error.message
        );

        console.error(error);

        return;
    }


    selectedOrder.status =
        newStatus;


    alert(
        "Order status updated successfully!"
    );


    closeModal();

    await loadOrders();

}


/* =========================================================
   HELPERS
   ========================================================= */

function normalizeStatus(status) {

    if (!status) {
        return "new";
    }

    return String(status)
        .toLowerCase()
        .trim()
        .replace(/\s+/g, "_");

}


function statusBadge(status) {

    const normalized =
        normalizeStatus(status);


    let label =
        normalized;


    if (normalized === "new") {
        label = "New";
    }

    else if (normalized === "confirmed") {
        label = "Confirmed";
    }

    else if (normalized === "preparing") {
        label = "Preparing";
    }

    else if (normalized === "delivered") {
        label = "Delivered";
    }

    else if (normalized === "cancelled") {
        label = "Cancelled";
    }


    return `
        <span class="status status-${escapeHtml(normalized)}">
            ${escapeHtml(label)}
        </span>
    `;

}


function getOrderTotal(order) {

    const value =
        order.total ??
        order.total_price ??
        order.price ??
        0;


    return Number(value)
        .toLocaleString();

}


function getColor(order) {

    if (order.color) {
        return order.color;
    }

    if (order.colors) {
        return order.colors;
    }

    if (order.color_1 && order.color_2) {

        return (
            order.color_1 +
            " + " +
            order.color_2
        );

    }

    if (order.color_1) {
        return order.color_1;
    }

    if (order.color_2) {
        return order.color_2;
    }

    return "-";

}


function formatDate(date) {

    if (!date) {
        return "-";
    }

    const d =
        new Date(date);


    if (isNaN(d.getTime())) {
        return date;
    }


    return d.toLocaleString();

}


function escapeHtml(value) {

    if (value === null || value === undefined) {
        return "";
    }


    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================================
   MODAL
   ========================================================= */

function closeModal() {

    document.getElementById("detailsModal")
        .style.display = "none";

}


window.onclick = function(event) {

    const modal =
        document.getElementById("detailsModal");


    if (event.target === modal) {
        closeModal();
    }

};


/* =========================================================
   START
   ========================================================= */

loadOrders();

</script>
