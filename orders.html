<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>X3D Printing | Orders</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg:#080816;
    --surface:#11172a;
    --surface2:#0b1020;
    --border:rgba(255,255,255,.10);
    --text:#fff;
    --muted:#aeb6cc;
    --primary:#8b5cf6;
    --green:#22c55e;
    --orange:#f59e0b;
    --red:#ef4444;
    --blue:#3b82f6;
}

body{
    font-family:Arial,Helvetica,sans-serif;

    background:
        radial-gradient(
            circle at top right,
            #17153b 0%,
            #080816 45%
        ),
        var(--bg);

    color:var(--text);
    min-height:100vh;
}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{
    position:fixed;
    left:0;
    top:0;

    width:250px;
    height:100vh;

    background:rgba(10,12,28,.96);

    border-right:1px solid var(--border);

    padding:25px 18px;

    z-index:100;
}

.logo{
    font-size:25px;
    font-weight:800;

    padding:10px 12px 30px;
}

.logo span{
    color:var(--primary);
}

.menu-title{
    color:#68728a;

    font-size:11px;
    font-weight:bold;

    text-transform:uppercase;

    padding:0 12px;

    margin-bottom:10px;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.menu-item{
    display:flex;
    align-items:center;

    gap:12px;

    color:var(--muted);

    padding:13px 14px;

    border-radius:11px;

    cursor:pointer;

    transition:.2s;

    text-decoration:none;
}

.menu-item:hover,
.menu-item.active{
    background:rgba(139,92,246,.16);
    color:#fff;
}

.menu-item.active{
    border-left:3px solid var(--primary);
}

.menu-icon{
    width:24px;
    text-align:center;
}


/* =====================================================
   MAIN
===================================================== */

.main{
    margin-left:250px;
    padding:30px 35px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:30px;

    gap:20px;
}

.page-title h1{
    font-size:30px;
    margin-bottom:7px;
}

.page-title p{
    color:var(--muted);
}

.refresh-btn{
    border:1px solid rgba(139,92,246,.4);

    background:
        linear-gradient(
            135deg,
            #5b21b6,
            #8b5cf6
        );

    color:#fff;

    padding:11px 18px;

    border-radius:10px;

    cursor:pointer;

    font-weight:bold;
}


/* =====================================================
   STATS
===================================================== */

.stats{
    display:grid;

    grid-template-columns:
        repeat(5,1fr);

    gap:15px;

    margin-bottom:25px;
}

.stat-card{
    background:rgba(17,23,42,.92);

    border:1px solid var(--border);

    border-radius:17px;

    padding:20px;
}

.stat-label{
    color:var(--muted);

    font-size:13px;

    margin-bottom:12px;
}

.stat-value{
    font-size:28px;
    font-weight:bold;
}


/* =====================================================
   ORDERS CARD
===================================================== */

.orders-card{
    background:rgba(17,23,42,.92);

    border:1px solid var(--border);

    border-radius:20px;

    overflow:hidden;
}

.orders-header{
    padding:22px;

    border-bottom:1px solid var(--border);

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:15px;
}

.orders-header h2{
    font-size:21px;
}

.orders-actions{
    display:flex;
    gap:10px;
}

.search{
    background:#0b1020;

    border:1px solid var(--border);

    color:#fff;

    padding:10px 13px;

    border-radius:9px;

    outline:none;

    width:250px;
}

.search:focus{
    border-color:var(--primary);
}

.filter{
    background:#0b1020;

    border:1px solid var(--border);

    color:#fff;

    padding:10px 13px;

    border-radius:9px;

    outline:none;
}

.table-wrapper{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;

    border-collapse:collapse;

    min-width:1200px;
}

th{
    text-align:left;

    color:#7f89a3;

    font-size:12px;

    text-transform:uppercase;

    padding:16px 20px;

    background:rgba(7,10,23,.45);

    white-space:nowrap;
}

td{
    padding:17px 20px;

    border-top:1px solid var(--border);

    white-space:nowrap;
}

tr:hover td{
    background:rgba(139,92,246,.04);
}

.order-id{
    color:#a78bfa;
    font-weight:bold;
}

.customer-name{
    font-weight:bold;
}

.customer-phone{
    color:var(--muted);
    font-size:12px;
    margin-top:4px;
}

.amount{
    font-weight:bold;
}


/* =====================================================
   STATUS
===================================================== */

.status{
    display:inline-flex;

    padding:6px 10px;

    border-radius:20px;

    font-size:12px;

    font-weight:bold;
}

.status-new{
    background:rgba(59,130,246,.15);
    color:#60a5fa;
}

.status-confirmed{
    background:rgba(34,197,94,.15);
    color:#4ade80;
}

.status-preparing{
    background:rgba(245,158,11,.15);
    color:#fbbf24;
}

.status-out_for_delivery{
    background:rgba(6,182,212,.15);
    color:#67e8f9;
}

.status-delivered{
    background:rgba(139,92,246,.15);
    color:#a78bfa;
}

.status-cancelled{
    background:rgba(239,68,68,.15);
    color:#f87171;
}

.status-unknown{
    background:rgba(148,163,184,.15);
    color:#cbd5e1;
}


/* =====================================================
   BUTTON
===================================================== */

.view-btn{
    border:1px solid rgba(139,92,246,.35);

    background:rgba(139,92,246,.10);

    color:#c4b5fd;

    padding:7px 11px;

    border-radius:8px;

    cursor:pointer;
}

.view-btn:hover{
    background:rgba(139,92,246,.20);
}


/* =====================================================
   LOADING
===================================================== */

.loading,
.empty{
    padding:50px;

    text-align:center;

    color:var(--muted);
}

.error{
    padding:30px;

    text-align:center;

    color:#f87171;
}


/* =====================================================
   MODAL
===================================================== */

.modal{
    display:none;

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.75);

    z-index:500;

    align-items:center;

    justify-content:center;

    padding:20px;
}

.modal-box{
    width:100%;

    max-width:750px;

    max-height:90vh;

    overflow-y:auto;

    background:#11172a;

    border:1px solid var(--border);

    border-radius:20px;

    padding:25px;
}

.modal-header{
    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:25px;
}

.close{
    background:transparent;

    border:none;

    color:#fff;

    font-size:28px;

    cursor:pointer;
}

.details-grid{
    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:15px;
}

.detail{
    background:#0b1020;

    border:1px solid var(--border);

    border-radius:12px;

    padding:14px;
}

.detail.full{
    grid-column:1/-1;
}

.detail-label{
    color:#7f89a3;

    font-size:11px;

    text-transform:uppercase;

    margin-bottom:7px;
}

.detail-value{
    color:#fff;

    word-break:break-word;
}


/* =====================================================
   STATUS CONTROL
===================================================== */

.status-control{
    margin-top:5px;
}

.status-select{
    width:100%;

    background:#0b1020;

    border:1px solid var(--border);

    color:#fff;

    padding:12px;

    border-radius:9px;

    outline:none;
}

.save-status{
    width:100%;

    margin-top:12px;

    padding:12px;

    border:none;

    border-radius:9px;

    background:
        linear-gradient(
            135deg,
            #6d28d9,
            #8b5cf6
        );

    color:#fff;

    font-weight:bold;

    cursor:pointer;
}

.save-status:disabled{
    opacity:.6;
    cursor:not-allowed;
}


/* =====================================================
   INFO BADGES
===================================================== */

.info-badge{
    display:inline-flex;

    padding:5px 9px;

    border-radius:20px;

    font-size:11px;

    font-weight:bold;
}

.badge-green{
    background:rgba(34,197,94,.15);
    color:#4ade80;
}

.badge-red{
    background:rgba(239,68,68,.15);
    color:#f87171;
}

.badge-orange{
    background:rgba(245,158,11,.15);
    color:#fbbf24;
}

.badge-gray{
    background:rgba(148,163,184,.15);
    color:#cbd5e1;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:1200px){

    .stats{
        grid-template-columns:
            repeat(3,1fr);
    }

}

@media(max-width:900px){

    .sidebar{
        position:relative;

        width:100%;

        height:auto;

        border-right:none;

        border-bottom:
            1px solid var(--border);
    }

    .main{
        margin-left:0;

        padding:22px 15px;
    }

    .menu{
        flex-direction:row;

        overflow-x:auto;
    }

    .menu-item{
        min-width:max-content;
    }

    .menu-title{
        display:none;
    }

    .topbar{
        flex-direction:column;

        align-items:flex-start;
    }

    .orders-header{
        flex-direction:column;

        align-items:stretch;
    }

    .orders-actions{
        flex-direction:column;
    }

    .search{
        width:100%;
    }

}

@media(max-width:600px){

    .stats{
        grid-template-columns:1fr;
    }

    .details-grid{
        grid-template-columns:1fr;
    }

    .detail.full{
        grid-column:auto;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     SIDEBAR
===================================================== -->

<aside class="sidebar">

    <div class="logo">
        X<span>3D</span> Admin
    </div>

    <div class="menu-title">
        Management
    </div>

    <div class="menu">

        <a
            class="menu-item"
            href="admin.html"
        >
            <span class="menu-icon">📊</span>
            Dashboard
        </a>


        <a
            class="menu-item active"
            href="orders.html"
        >
            <span class="menu-icon">🛒</span>
            Orders
        </a>


        <!-- FIXED PRODUCTS LINK -->

        <a
            class="menu-item"
            href="product.html"
        >
            <span class="menu-icon">📦</span>
            Products
        </a>


        <a
            class="menu-item"
            href="#customers"
        >
            <span class="menu-icon">👥</span>
            Customers
        </a>


        <a
            class="menu-item"
            href="#custom"
        >
            <span class="menu-icon">🎨</span>
            Custom Requests
        </a>

    </div>

</aside>



<!-- =====================================================
     MAIN
===================================================== -->

<main class="main">


    <div class="topbar">

        <div class="page-title">

            <h1>
                Orders
            </h1>

            <p>
                Manage and track all customer orders.
            </p>

        </div>


        <button
            class="refresh-btn"
            onclick="loadOrders()"
        >
            ↻ Refresh
        </button>

    </div>



    <!-- =====================================================
         STATS
    ===================================================== -->

    <section class="stats">


        <div class="stat-card">

            <div class="stat-label">
                Total Orders
            </div>

            <div
                class="stat-value"
                id="totalOrders"
            >
                0
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-label">
                New Orders
            </div>

            <div
                class="stat-value"
                id="newOrders"
            >
                0
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-label">
                Preparing
            </div>

            <div
                class="stat-value"
                id="preparingOrders"
            >
                0
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-label">
                Out for Delivery
            </div>

            <div
                class="stat-value"
                id="deliveryOrders"
            >
                0
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-label">
                Delivered
            </div>

            <div
                class="stat-value"
                id="deliveredOrders"
            >
                0
            </div>

        </div>

    </section>



    <!-- =====================================================
         ORDERS
    ===================================================== -->

    <section class="orders-card">


        <div class="orders-header">

            <h2>
                All Orders
            </h2>


            <div class="orders-actions">

                <input
                    class="search"
                    id="searchInput"
                    type="text"
                    placeholder="Search customer, phone, product..."
                    oninput="renderOrders()"
                >


                <select
                    class="filter"
                    id="statusFilter"
                    onchange="renderOrders()"
                >

                    <option value="all">
                        All Status
                    </option>

                    <option value="new">
                        New
                    </option>

                    <option value="confirmed">
                        Confirmed
                    </option>

                    <option value="preparing">
                        Preparing
                    </option>

                    <option value="out_for_delivery">
                        Out for Delivery
                    </option>

                    <option value="delivered">
                        Delivered
                    </option>

                    <option value="cancelled">
                        Cancelled
                    </option>

                </select>

            </div>

        </div>


        <div
            class="table-wrapper"
            id="tableContainer"
        >

            <div class="loading">
                Loading orders...
            </div>

        </div>

    </section>

</main>



<!-- =====================================================
     ORDER DETAILS MODAL
===================================================== -->

<div
    class="modal"
    id="detailsModal"
>

    <div class="modal-box">


        <div class="modal-header">

            <h2>
                Order Details
            </h2>

            <button
                class="close"
                onclick="closeModal()"
            >
                ×
            </button>

        </div>


        <div
            class="details-grid"
            id="detailsContent"
        >
        </div>


    </div>

</div>



<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://wxezuqdktbftlkjxqcmi.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_Z1_vjXxFAUU_PAI05Hqd4w_zjopEwwH";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =====================================================
   GLOBAL
===================================================== */

let orders = [];

let selectedOrder = null;


/* =====================================================
   LOAD ORDERS
===================================================== */

async function loadOrders(){

    const container =
        document.getElementById(
            "tableContainer"
        );

    container.innerHTML = `
        <div class="loading">
            Loading orders...
        </div>
    `;

    try{

        const {
            data,
            error
        } =
            await supabaseClient
                .from("orders")
                .select("*")
                .order(
                    "id",
                    {
                        ascending:false
                    }
                );

        if(error){

            throw error;

        }

        orders =
            data || [];

        updateStats();

        renderOrders();

    }

    catch(error){

        console.error(
            "Load orders error:",
            error
        );

        container.innerHTML = `
            <div class="error">

                ❌ Failed to load orders.

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>
        `;

    }

}


/* =====================================================
   STATUS
===================================================== */

function normalizeStatus(status){

    if(
        status === null ||
        status === undefined ||
        status === ""
    ){

        return "new";

    }

    return String(status)
        .toLowerCase()
        .trim()
        .replace(
            /\s+/g,
            "_"
        );

}


function getStatus(order){

    return normalizeStatus(
        order &&
        order.order_status
    );

}


/* =====================================================
   STATUS LABEL
===================================================== */

function getStatusLabel(status){

    const normalized =
        normalizeStatus(status);

    const labels = {

        new:
            "New",

        confirmed:
            "Confirmed",

        preparing:
            "Preparing",

        out_for_delivery:
            "Out for Delivery",

        delivered:
            "Delivered",

        cancelled:
            "Cancelled"

    };

    return (
        labels[normalized] ||
        normalized
    );

}


/* =====================================================
   STATUS BADGE
===================================================== */

function statusBadge(status){

    const normalized =
        normalizeStatus(status);

    const label =
        getStatusLabel(normalized);

    const known = [

        "new",
        "confirmed",
        "preparing",
        "out_for_delivery",
        "delivered",
        "cancelled"

    ];

    const cssStatus =
        known.includes(normalized)
        ?
        normalized
        :
        "unknown";

    return `

        <span
            class="status status-${escapeHtml(
                cssStatus
            )}"
        >

            ${escapeHtml(
                label
            )}

        </span>

    `;

}


/* =====================================================
   STATS
===================================================== */

function updateStats(){

    document.getElementById(
        "totalOrders"
    ).textContent =
        orders.length;


    document.getElementById(
        "newOrders"
    ).textContent =
        orders.filter(
            order =>
                getStatus(order) ===
                "new"
        ).length;


    document.getElementById(
        "preparingOrders"
    ).textContent =
        orders.filter(
            order =>
                getStatus(order) ===
                "preparing"
        ).length;


    document.getElementById(
        "deliveryOrders"
    ).textContent =
        orders.filter(
            order =>
                getStatus(order) ===
                "out_for_delivery"
        ).length;


    document.getElementById(
        "deliveredOrders"
    ).textContent =
        orders.filter(
            order =>
                getStatus(order) ===
                "delivered"
        ).length;

}


/* =====================================================
   RENDER
===================================================== */

function renderOrders(){

    const container =
        document.getElementById(
            "tableContainer"
        );

    const search =
        document.getElementById(
            "searchInput"
        )
        .value
        .toLowerCase()
        .trim();

    const selectedStatus =
        document.getElementById(
            "statusFilter"
        ).value;


    let filtered =
        [...orders];


    /* SEARCH */

    if(search){

        filtered =
            filtered.filter(
                order => {

                    const values = [

                        order.customer_name,

                        order.phone,

                        order.governorate,

                        order.area,

                        order.address,

                        order.product_name,

                        order.product,

                        order.product_id,

                        order.color,

                        order.payment_method

                    ];


                    return values.some(
                        value =>
                            String(
                                value || ""
                            )
                            .toLowerCase()
                            .includes(search)
                    );

                }
            );

    }


    /* STATUS */

    if(
        selectedStatus !==
        "all"
    ){

        filtered =
            filtered.filter(
                order =>
                    getStatus(order) ===
                    selectedStatus
            );

    }


    /* EMPTY */

    if(
        filtered.length ===
        0
    ){

        container.innerHTML = `

            <div class="empty">

                No orders found.

            </div>

        `;

        return;

    }


    /* TABLE */

    container.innerHTML = `

        <table>

            <thead>

                <tr>

                    <th>Order</th>

                    <th>Customer</th>

                    <th>Location</th>

                    <th>Product</th>

                    <th>Qty</th>

                    <th>Color</th>

                    <th>Total</th>

                    <th>Payment</th>

                    <th>Status</th>

                    <th>Action</th>

                </tr>

            </thead>


            <tbody>

                ${filtered.map(
                    order => `

                    <tr>

                        <td>

                            <span class="order-id">

                                #${escapeHtml(
                                    order.id
                                )}

                            </span>

                        </td>


                        <td>

                            <div
                                class="customer-name"
                            >

                                ${escapeHtml(
                                    order.customer_name ||
                                    "Unknown"
                                )}

                            </div>

                            <div
                                class="customer-phone"
                            >

                                ${escapeHtml(
                                    order.phone ||
                                    "-"
                                )}

                            </div>

                        </td>


                        <td>

                            ${escapeHtml(

                                [
                                    order.governorate,
                                    order.area
                                ]
                                .filter(Boolean)
                                .join(" - ")

                                ||

                                "-"

                            )}

                        </td>


                        <td>

                            ${escapeHtml(

                                order.product_name ||

                                order.product ||

                                order.product_id ||

                                "-"

                            )}

                        </td>


                        <td>

                            ${escapeHtml(
                                order.quantity ??
                                1
                            )}

                        </td>


                        <td>

                            ${escapeHtml(
                                getColor(order)
                            )}

                        </td>


                        <td>

                            <span class="amount">

                                EGP ${escapeHtml(
                                    getOrderTotal(
                                        order
                                    )
                                )}

                            </span>

                        </td>


                        <td>

                            ${escapeHtml(
                                order.payment_method ||
                                "-"
                            )}

                        </td>


                        <td>

                            ${statusBadge(
                                order.order_status
                            )}

                        </td>


                        <td>

                            <button
                                class="view-btn"
                                onclick="viewOrder(${Number(
                                    order.id
                                )})"
                            >

                                View

                            </button>

                        </td>

                    </tr>

                `
                ).join("")}

            </tbody>

        </table>

    `;

}


/* =====================================================
   VIEW ORDER
===================================================== */

function viewOrder(id){

    selectedOrder =
        orders.find(
            order =>
                Number(order.id) ===
                Number(id)
        );


    if(!selectedOrder){

        alert(
            "Order not found."
        );

        return;

    }


    const order =
        selectedOrder;


    const currentStatus =
        getStatus(order);


    document.getElementById(
        "detailsContent"
    ).innerHTML = `

        <!-- ORDER -->

        <div class="detail">

            <div class="detail-label">
                Order ID
            </div>

            <div class="detail-value">
                #${escapeHtml(order.id)}
            </div>

        </div>


        <!-- CREATED -->

        <div class="detail">

            <div class="detail-label">
                Created At
            </div>

/* =====================================================
   STATUS OPTION
===================================================== */

function statusOption(
    value,
    label,
    current
){

    return `

        <option
            value="${escapeHtml(value)}"
            ${
                current === value
                ?
                "selected"
                :
                ""
            }
        >

            ${escapeHtml(label)}

        </option>

    `;

}


/* =====================================================
   UPDATE STATUS
===================================================== */

async function updateOrderStatus(){

    if(!selectedOrder){

        alert(
            "No order selected."
        );

        return;

    }


    const select =
        document.getElementById(
            "orderStatus"
        );

    const button =
        document.getElementById(
            "saveStatusButton"
        );


    if(!select){

        return;

    }


    const newStatus =
        select.value;


    const validStatuses = [

        "new",
        "confirmed",
        "preparing",
        "out_for_delivery",
        "delivered",
        "cancelled"

    ];


    if(
        !validStatuses.includes(
            newStatus
        )
    ){

        alert(
            "Invalid order status."
        );

        return;

    }


    if(button){

        button.disabled = true;

        button.textContent =
            "Saving...";

    }


    try{

        const {
            data,
            error
        } =
            await supabaseClient
                .from("orders")
                .update({

                    order_status:
                        newStatus

                })
                .eq(
                    "id",
                    selectedOrder.id
                )
                .select();


        if(error){

            throw error;

        }


        if(
            !data ||
            data.length === 0
        ){

            alert(

                "The status was not changed.\n\n" +

                "Check the UPDATE RLS policy on the orders table."

            );

            return;

        }


        selectedOrder.order_status =
            newStatus;


        const index =
            orders.findIndex(
                order =>
                    Number(order.id) ===
                    Number(
                        selectedOrder.id
                    )
            );


        if(index !== -1){

            orders[index]
                .order_status =
                    newStatus;

        }


        updateStats();

        renderOrders();

        closeModal();


        alert(
            "Order status updated successfully!"
        );

    }

    catch(error){

        console.error(
            "Status update error:",
            error
        );

        alert(

            "Failed to update status:\n\n" +

            error.message

        );

    }

    finally{

        if(button){

            button.disabled =
                false;

            button.textContent =
                "Save Status";

        }

    }

}


/* =====================================================
   TOTAL
===================================================== */

function getOrderTotal(order){

    const value =

        order.total_price ??

        order.total ??

        order.subtotal ??

        0;


    const number =
        Number(value);


    if(
        Number.isNaN(number)
    ){

        return "0";

    }


    return number.toLocaleString();

}


/* =====================================================
   MONEY
===================================================== */

function formatMoney(value){

    const number =
        Number(value ?? 0);


    if(
        Number.isNaN(number)
    ){

        return "0";

    }


    return number.toLocaleString();

}


/* =====================================================
   COLOR
===================================================== */

function getColor(order){

    if(order.color){

        return order.color;

    }

    if(order.colors){

        return order.colors;

    }

    if(
        order.color_1 &&
        order.color_2
    ){

        return (

            order.color_1 +
            " + " +
            order.color_2

        );

    }

    if(order.color_1){

        return order.color_1;

    }

    if(order.color_2){

        return order.color_2;

    }

    return "-";

}


/* =====================================================
   BOOLEAN BADGE
===================================================== */

function booleanBadge(value){

    const yes =
        value === true ||
        value === "true" ||
        value === 1 ||
        value === "1";


    if(yes){

        return `

            <span class="info-badge badge-green">
                Yes
            </span>

        `;

    }


    return `

        <span class="info-badge badge-gray">
            No
        </span>

    `;

}


/* =====================================================
   INFO BADGE
===================================================== */

function infoBadge(value){

    if(!value){

        return `

            <span class="info-badge badge-gray">
                -
            </span>

        `;

    }


    const normalized =
        String(value)
        .toLowerCase()
        .trim();


    let css =
        "badge-gray";


    if(
        normalized ===
        "paid" ||
        normalized ===
        "confirmed"
    ){

        css =
            "badge-green";

    }

    else if(
        normalized ===
        "pending"
    ){

        css =
            "badge-orange";

    }

    else if(
        normalized ===
        "failed"
    ){

        css =
            "badge-red";

    }


    return `

        <span
            class="info-badge ${css}"
        >

            ${escapeHtml(
                String(value)
            )}

        </span>

    `;

}


/* =====================================================
   DATE
===================================================== */

function formatDate(date){

    if(!date){

        return "-";

    }


    const d =
        new Date(date);


    if(
        isNaN(
            d.getTime()
        )
    ){

        return String(date);

    }


    return d.toLocaleString();

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   CLOSE MODAL
===================================================== */

function closeModal(){

    document.getElementById(
        "detailsModal"
    ).style.display =
        "none";

    selectedOrder =
        null;

}
