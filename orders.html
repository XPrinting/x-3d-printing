<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>X3D Printing | Orders</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        :root {

            --bg: #080816;
            --surface: #11172a;
            --surface-2: #0b1020;

            --border:
                rgba(255,255,255,.10);

            --text: #ffffff;
            --muted: #aeb6cc;

            --primary: #8b5cf6;
            --primary-dark: #6d28d9;

            --green: #22c55e;
            --orange: #f59e0b;
            --red: #ef4444;
            --blue: #3b82f6;

        }


        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:

                radial-gradient(
                    circle at top right,
                    #17153b 0%,
                    #080816 45%
                ),

                var(--bg);

            color:
                var(--text);

            min-height:
                100vh;

        }


        /* =====================================================
           SIDEBAR
        ===================================================== */

        .sidebar {

            position:
                fixed;

            left:
                0;

            top:
                0;

            width:
                250px;

            height:
                100vh;

            background:
                rgba(10,12,28,.96);

            border-right:
                1px solid var(--border);

            padding:
                25px 18px;

            z-index:
                100;

        }


        .logo {

            font-size:
                25px;

            font-weight:
                800;

            padding:
                10px 12px 30px;

        }


        .logo span {

            color:
                var(--primary);

        }


        .menu-title {

            color:
                #68728a;

            font-size:
                11px;

            font-weight:
                bold;

            text-transform:
                uppercase;

            padding:
                0 12px;

            margin-bottom:
                10px;

        }


        .menu {

            display:
                flex;

            flex-direction:
                column;

            gap:
                6px;

        }


        .menu-item {

            display:
                flex;

            align-items:
                center;

            gap:
                12px;

            color:
                var(--muted);

            padding:
                13px 14px;

            border-radius:
                11px;

            cursor:
                pointer;

            transition:
                .2s;

            text-decoration:
                none;

        }


        .menu-item:hover {

            background:
                rgba(139,92,246,.16);

            color:
                white;

        }


        .menu-item.active {

            background:
                rgba(139,92,246,.16);

            color:
                white;

            border-left:
                3px solid var(--primary);

        }


        .menu-icon {

            width:
                24px;

            text-align:
                center;

        }


        /* =====================================================
           MAIN
        ===================================================== */

        .main {

            margin-left:
                250px;

            padding:
                30px 35px;

        }


        .topbar {

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                center;

            margin-bottom:
                30px;

            gap:
                20px;

        }


        .page-title h1 {

            font-size:
                30px;

            margin-bottom:
                7px;

        }


        .page-title p {

            color:
                var(--muted);

        }


        .refresh-btn {

            border:
                1px solid rgba(139,92,246,.4);

            background:

                linear-gradient(
                    135deg,
                    #5b21b6,
                    #8b5cf6
                );

            color:
                white;

            padding:
                11px 18px;

            border-radius:
                10px;

            cursor:
                pointer;

            font-weight:
                bold;

        }


        /* =====================================================
           STATS
        ===================================================== */

        .stats {

            display:
                grid;

            grid-template-columns:
                repeat(4,1fr);

            gap:
                18px;

            margin-bottom:
                25px;

        }


        .stat-card {

            background:
                rgba(17,23,42,.92);

            border:
                1px solid var(--border);

            border-radius:
                17px;

            padding:
                20px;

        }


        .stat-label {

            color:
                var(--muted);

            font-size:
                13px;

            margin-bottom:
                12px;

        }


        .stat-value {

            font-size:
                28px;

            font-weight:
                bold;

        }


        /* =====================================================
           ORDERS CARD
        ===================================================== */

        .orders-card {

            background:
                rgba(17,23,42,.92);

            border:
                1px solid var(--border);

            border-radius:
                20px;

            overflow:
                hidden;

        }


        .orders-header {

            padding:
                22px;

            border-bottom:
                1px solid var(--border);

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                center;

            gap:
                15px;

        }


        .orders-header h2 {

            font-size:
                21px;

        }


        .orders-actions {

            display:
                flex;

            gap:
                10px;

        }


        .search {

            background:
                #0b1020;

            border:
                1px solid var(--border);

            color:
                white;

            padding:
                10px 13px;

            border-radius:
                9px;

            outline:
                none;

            width:
                250px;

        }


        .search:focus {

            border-color:
                var(--primary);

        }


        .filter {

            background:
                #0b1020;

            border:
                1px solid var(--border);

            color:
                white;

            padding:
                10px 13px;

            border-radius:
                9px;

            outline:
                none;

        }


        .table-wrapper {

            width:
                100%;

            overflow-x:
                auto;

        }


        table {

            width:
                100%;

            border-collapse:
                collapse;

            min-width:
                1050px;

        }


        th {

            text-align:
                left;

            color:
                #7f89a3;

            font-size:
                12px;

            text-transform:
                uppercase;

            padding:
                16px 20px;

            background:
                rgba(7,10,23,.45);

            white-space:
                nowrap;

        }


        td {

            padding:
                17px 20px;

            border-top:
                1px solid var(--border);

            white-space:
                nowrap;

        }


        tr:hover td {

            background:
                rgba(139,92,246,.04);

        }


        .order-id {

            color:
                #a78bfa;

            font-weight:
                bold;

        }


        .customer-name {

            font-weight:
                bold;

        }


        .customer-phone {

            color:
                var(--muted);

            font-size:
                12px;

            margin-top:
                4px;

        }


        .amount {

            font-weight:
                bold;

        }


        /* =====================================================
           STATUS
        ===================================================== */

        .status {

            display:
                inline-flex;

            align-items:
                center;

            justify-content:
                center;

            padding:
                6px 10px;

            border-radius:
                20px;

            font-size:
                12px;

            font-weight:
                bold;

        }


        .status-new {

            background:
                rgba(59,130,246,.15);

            color:
                #60a5fa;

        }


        .status-confirmed {

            background:
                rgba(34,197,94,.15);

            color:
                #4ade80;

        }


        .status-preparing {

            background:
                rgba(245,158,11,.15);

            color:
                #fbbf24;

        }


        .status-delivered {

            background:
                rgba(139,92,246,.15);

            color:
                #a78bfa;

        }


        .status-cancelled {

            background:
                rgba(239,68,68,.15);

            color:
                #f87171;

        }


        .view-btn {

            border:
                1px solid rgba(139,92,246,.35);

            background:
                rgba(139,92,246,.10);

            color:
                #c4b5fd;

            padding:
                7px 11px;

            border-radius:
                8px;

            cursor:
                pointer;

        }


        .view-btn:hover {

            background:
                rgba(139,92,246,.20);

        }


        /* =====================================================
           STOCK BADGE
        ===================================================== */

        .stock-badge {

            display:
                inline-flex;

            padding:
                5px 9px;

            border-radius:
                20px;

            font-size:
                11px;

            font-weight:
                bold;

        }


        .stock-deducted {

            background:
                rgba(34,197,94,.12);

            color:
                #4ade80;

        }


        .stock-not-deducted {

            background:
                rgba(148,163,184,.12);

            color:
                #94a3b8;

        }


        /* =====================================================
           LOADING / ERROR
        ===================================================== */

        .loading,
        .empty {

            padding:
                50px;

            text-align:
                center;

            color:
                var(--muted);

        }


        .error {

            padding:
                30px;

            text-align:
                center;

            color:
                #f87171;

        }


        /* =====================================================
           MODAL
        ===================================================== */

        .modal {

            display:
                none;

            position:
                fixed;

            inset:
                0;

            background:
                rgba(0,0,0,.75);

            z-index:
                500;

            align-items:
                center;

            justify-content:
                center;

            padding:
                20px;

        }


        .modal-box {

            width:
                100%;

            max-width:
                700px;

            max-height:
                90vh;

            overflow-y:
                auto;

            background:
                #11172a;

            border:
                1px solid var(--border);

            border-radius:
                20px;

            padding:
                25px;

        }


        .modal-header {

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                center;

            margin-bottom:
                25px;

        }


        .close {

            background:
                transparent;

            border:
                none;

            color:
                white;

            font-size:
                28px;

            cursor:
                pointer;

        }


        .details-grid {

            display:
                grid;

            grid-template-columns:
                1fr 1fr;

            gap:
                15px;

        }


        .detail {

            background:
                #0b1020;

            border:
                1px solid var(--border);

            border-radius:
                12px;

            padding:
                14px;

        }


        .detail.full {

            grid-column:
                1 / -1;

        }


        .detail-label {

            color:
                #7f89a3;

            font-size:
                11px;

            text-transform:
                uppercase;

            margin-bottom:
                7px;

        }


        .detail-value {

            color:
                white;

            word-break:
                break-word;

        }


        /* =====================================================
           STATUS CONTROL
        ===================================================== */

        .status-control {

            margin-top:
                5px;

        }


        .status-select {

            width:
                100%;

            background:
                #0b1020;

            border:
                1px solid var(--border);

            color:
                white;

            padding:
                12px;

            border-radius:
                9px;

            outline:
                none;

        }


        .status-select:focus {

            border-color:
                var(--primary);

        }


        .save-status {

            width:
                100%;

            margin-top:
                12px;

            padding:
                12px;

            border:
                none;

            border-radius:
                9px;

            background:

                linear-gradient(
                    135deg,
                    #6d28d9,
                    #8b5cf6
                );

            color:
                white;

            font-weight:
                bold;

            cursor:
                pointer;

        }


        .save-status:disabled {

            opacity:
                .6;

            cursor:
                not-allowed;

        }


        .stock-info {

            margin-top:
                12px;

            padding:
                12px;

            border-radius:
                10px;

            background:
                rgba(59,130,246,.08);

            border:
                1px solid rgba(59,130,246,.18);

            color:
                #93c5fd;

            font-size:
                13px;

            line-height:
                1.5;

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width:1100px) {

            .stats {

                grid-template-columns:
                    repeat(2,1fr);

            }

        }


        @media (max-width:800px) {

            .sidebar {

                position:
                    relative;

                width:
                    100%;

                height:
                    auto;

                border-right:
                    none;

                border-bottom:
                    1px solid var(--border);

            }


            .main {

                margin-left:
                    0;

                padding:
                    22px 15px;

            }


            .menu {

                flex-direction:
                    row;

                overflow-x:
                    auto;

            }


            .menu-item {

                min-width:
                    max-content;

            }


            .menu-title {

                display:
                    none;

            }


            .topbar {

                flex-direction:
                    column;

                align-items:
                    flex-start;

            }


            .orders-header {

                flex-direction:
                    column;

                align-items:
                    stretch;

            }


            .orders-actions {

                flex-direction:
                    column;

            }


            .search {

                width:
                    100%;

            }

        }


        @media (max-width:550px) {

            .stats {

                grid-template-columns:
                    1fr;

            }


            .details-grid {

                grid-template-columns:
                    1fr;

            }


            .detail.full {

                grid-column:
                    auto;

            }

        }

    </style>

</head>


<body>

<!-- =========================================================

        <div class="stat-card">

            </div>

            </div>

                >

                    <option value="all">

                    </option>

                    </option>

                        Confirmed

                        Preparing
                    </option>

        </div>

<script>


/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://wxezuqdktbftlkjxqcmi.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_Z1_vjXxFAUU_PAI05Hqd4w_zjopEwwH";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );



/* =========================================================
   GLOBAL
========================================================= */

let orders = [];

let selectedOrder = null;



/* =========================================================
   LOAD ORDERS
========================================================= */

async function loadOrders() {


    const container =
        document.getElementById(
            "tableContainer"
        );


    container.innerHTML = `

        <div class="loading">
            Loading orders...
        </div>

    `;


    try {


        const {
            data,
            error
        } = await supabaseClient

            .from("orders")

            .select("*")

            .order(
                "id",
                {
                    ascending: false
                }
            );


        if (error) {

            console.error(
                "Load orders error:",
                error
            );


            container.innerHTML = `

                <div class="error">

                    ❌ Failed to load orders.

                    <br><br>

                    ${escapeHtml(
                        error.message
                    )}

                </div>

            `;


            return;

        }


        orders =
            data || [];


        console.log(
            "Orders loaded:",
            orders
        );


        updateStats();

        renderOrders();


    }

    catch (error) {


        console.error(
            "Unexpected error:",
            error
        );


        container.innerHTML = `

            <div class="error">

                ❌ Something went wrong.

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;

    }

}



/* =========================================================
   GET STATUS
   IMPORTANT:
   DATABASE COLUMN = order_status
========================================================= */

function getStatus(order) {


    return normalizeStatus(

        order
            ? order.order_status
            : null

    );

}



/* =========================================================
   STATS
========================================================= */

function updateStats() {


    const total =
        orders.length;


    const newOrders =
        orders.filter(
            order =>
                getStatus(order) ===
                "new"
        ).length;


    const preparing =
        orders.filter(
            order =>
                getStatus(order) ===
                "preparing"
        ).length;


    const delivered =
        orders.filter(
            order =>
                getStatus(order) ===
                "delivered"
        ).length;


    document.getElementById(
        "totalOrders"
    ).textContent =
        total;


    document.getElementById(
        "newOrders"
    ).textContent =
        newOrders;


    document.getElementById(
        "preparingOrders"
    ).textContent =
        preparing;


    document.getElementById(
        "deliveredOrders"
    ).textContent =
        delivered;

}



/* =========================================================
   RENDER ORDERS
========================================================= */

function renderOrders() {


    const container =
        document.getElementById(
            "tableContainer"
        );


    const search =
        document.getElementById(
            "searchInput"
        )
        .value
        .toLowerCase()
        .trim();


    const selectedStatus =
        document.getElementById(
            "statusFilter"
        ).value;


    let filtered =
        [...orders];



    /* =====================================================
       SEARCH
    ===================================================== */

    if (search) {


        filtered =
            filtered.filter(
                order => {


                    const name =
                        String(
                            order.customer_name ||
                            ""
                        )
                        .toLowerCase();


                    const phone =
                        String(
                            order.phone ||
                            ""
                        )
                        .toLowerCase();


                    const governorate =
                        String(
                            order.governorate ||
                            ""
                        )
                        .toLowerCase();


                    const area =
                        String(
                            order.area ||
                            ""
                        )
                        .toLowerCase();


                    const product =
                        String(

                            order.product_name ||

                            order.product ||

                            order.product_id ||

                            ""

                        )
                        .toLowerCase();


                    return (

                        name.includes(search)

                        ||

                        phone.includes(search)

                        ||

                        governorate.includes(search)

                        ||

                        area.includes(search)

                        ||

                        product.includes(search)

                    );

                }
            );

    }



    /* =====================================================
       STATUS FILTER
    ===================================================== */

    if (
        selectedStatus !==
        "all"
    ) {


        filtered =
            filtered.filter(
                order =>
                    getStatus(order) ===
                    selectedStatus
            );

    }



    /* =====================================================
       EMPTY
    ===================================================== */

    if (
        filtered.length ===
        0
    ) {


        container.innerHTML = `

            <div class="empty">

                No orders found.

            </div>

        `;


        return;

    }



    /* =====================================================
       TABLE
    ===================================================== */

    container.innerHTML = `

        <table>

            <thead>

                <tr>

                    <th>
                        Order
                    </th>

                    <th>
                        Customer
                    </th>

                    <th>
                        Location
                    </th>

                    <th>
                        Product
                    </th>

                    <th>
                        Quantity
                    </th>

                    <th>
                        Color
                    </th>

                    <th>
                        Total
                    </th>

                    <th>
                        Status
                    </th>

                    <th>
                        Stock
                    </th>

                    <th>
                        Action
                    </th>

                </tr>

            </thead>


            <tbody>

                ${filtered.map(
                    order => `

                    <tr>


                        <!-- ORDER -->

                        <td>

                            <span class="order-id">

                                #${escapeHtml(
                                    order.id
                                )}

                            </span>

                        </td>



                        <!-- CUSTOMER -->

                        <td>

                            <div class="customer-name">

                                ${escapeHtml(

                                    order.customer_name ||

                                    "Unknown"

                                )}

                            )}

                            )}

                        </td>


                    </tr>

                `
                ).join("")}

            </tbody>

        </table>

    `;

}

/* =========================================================
   UPDATE ORDER STATUS
   USING SUPABASE RPC
========================================================= */

async function updateOrderStatus() {


    if (!selectedOrder) {


        alert(
            "No order selected."
        );


        return;

    }


    const select =
        document.getElementById(
            "orderStatus"
        );


    const button =
        document.getElementById(
            "saveStatusButton"
        );


    if (!select) {


        alert(
            "Status selector not found."
        );


        return;

    }


    const newStatus =
        select.value;


    const oldStatus =
        getStatus(
            selectedOrder
        );


    const validStatuses = [

        "new",
        "confirmed",
        "preparing",
        "delivered",
        "cancelled"

    ];


    if (
        !validStatuses.includes(
            newStatus
        )
    ) {


        alert(
            "Invalid order status."
        );


        return;

    }



    /* NO CHANGE */

    if (
        newStatus ===
        oldStatus
    ) {


        alert(
            "The status is already " +
            newStatus +
            "."
        );


        return;

    }



    /* DISABLE */

    if (button) {


        button.disabled =
            true;


        button.textContent =
            "Saving...";

    }



    console.log(
        "Order ID:",
        selectedOrder.id
    );


    console.log(
        "Old status:",
        oldStatus
    );


    console.log(
        "New status:",
        newStatus
    );



    try {


        /*
         * IMPORTANT
         *
         * This calls the Supabase function:
         *
         * update_order_status
         *
         * The function is responsible for:
         *
         * 1. Updating order_status
         * 2. Checking stock
         * 3. Deducting stock
         * 4. Preventing double deduction
         * 5. Returning stock when cancelled
         *
         */


        const {
            data,
            error
        } = await supabaseClient.rpc(

            "update_order_status",

            {

                p_order_id:
                    Number(
                        selectedOrder.id
                    ),

                p_new_status:
                    newStatus

            }

        );



        /* =================================================
           RPC ERROR
        ================================================= */

        if (error) {


            console.error(
                "RPC error:",
                error
            );


            alert(

                "Failed to update order:\n\n" +

                error.message

            );


            return;

        }



        console.log(
            "RPC response:",
            data
        );



        /* =================================================
           CHECK RESPONSE
        ================================================= */

        if (
            !data
        ) {


            alert(

                "No response was returned from Supabase."

            );


            return;

        }



        /*
         * The SQL function should return:
         *
         * {
         *   success: true,
         *   stock_deducted: true/false
         * }
         *
         */


        if (
            data.success !== true
        ) {


            alert(

                data.message ||

                "The order status was not changed."

            );


            return;

        }



        /* =================================================
           UPDATE LOCAL ORDER
        ================================================= */

        selectedOrder.order_status =
            newStatus;


        if (
            typeof data.stock_deducted ===
            "boolean"
        ) {


            selectedOrder.stock_deducted =
                data.stock_deducted;

        }



        const index =
            orders.findIndex(

                order =>

                    Number(order.id) ===

                    Number(
                        selectedOrder.id
                    )

            );


        if (
            index !== -1
        ) {


            orders[index]
                .order_status =
                newStatus;


            if (
                typeof data.stock_deducted ===
                "boolean"
            ) {


                orders[index]
                    .stock_deducted =

                    data.stock_deducted;

            }

        }



        /* =================================================
           CLOSE MODAL
        ================================================= */

        closeModal();



        /* =================================================
           REFRESH UI
        ================================================= */

        updateStats();

        renderOrders();



        alert(
            "Order status updated successfully!"
        );


    }

    catch (error) {


        console.error(
            "Unexpected update error:",
            error
        );


        alert(

            "Failed to update order:\n\n" +

            error.message

        );

    }


    finally {


        if (button) {


            button.disabled =
                false;


            button.textContent =
                "Save Status";

        }

    }

}



/* =========================================================
   NORMALIZE STATUS
========================================================= */

function normalizeStatus(status) {


    if (

        status === null ||

        status === undefined ||

        status === ""

    ) {


        return "new";

    }


    return String(status)

        .toLowerCase()

        .trim()

        .replace(
            /\s+/g,
            "_"
        );

}



/* =========================================================
   STATUS BADGE
========================================================= */

function statusBadge(status) {


    const normalized =
        normalizeStatus(
            status
        );


    let label =
        normalized;


    if (
        normalized ===
        "new"
    ) {

        label =
            "New";

    }

    else if (
        normalized ===
        "confirmed"
    ) {

        label =
            "Confirmed";

    }

    else if (
        normalized ===
        "preparing"
    ) {

        label =
            "Preparing";

    }

    else if (
        normalized ===
        "delivered"
    ) {

        label =
            "Delivered";

    }

    else if (
        normalized ===
        "cancelled"
    ) {

        label =
            "Cancelled";

    }


    return `

        <span
            class="status status-${escapeHtml(
                normalized
            )}"
        >

            ${escapeHtml(
                label
            )}

        </span>

    `;

}



/* =========================================================
   STOCK BADGE
========================================================= */

function stockBadge(
    stockDeducted
) {


    if (
        stockDeducted === true
    ) {


        return `

            <span
                class="stock-badge stock-deducted"
            >

                Deducted

            </span>

        `;

    }


    return `

        <span
            class="stock-badge stock-not-deducted"
        >

            Not Deducted

        </span>

    `;

}



/* =========================================================
   ORDER TOTAL
========================================================= */

function getOrderTotal(order) {


    const value =

        order.total ??

        order.total_price ??

        order.price ??

        0;


    const number =
        Number(value);


    if (
        Number.isNaN(number)
    ) {


        return "0";

    }


    return number.toLocaleString();

}



/* =========================================================
   COLOR
========================================================= */

function getColor(order) {


    if (
        order.color
    ) {


        return order.color;

    }


    if (
        order.colors
    ) {


        return order.colors;

    }


    if (
        order.color_1 &&
        order.color_2
    ) {


        return (

            order.color_1 +

            " + " +

            order.color_2

        );

    }


    if (
        order.color_1
    ) {


        return order.color_1;

    }


    if (
        order.color_2
    ) {


        return order.color_2;

    }


    return "-";

}



/* =========================================================
   DATE
========================================================= */

function formatDate(date) {


    if (!date) {


        return "-";

    }


    const d =
        new Date(date);


    if (
        isNaN(
            d.getTime()
        )
    ) {


        return date;

    }


    return d.toLocaleString();

}



/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {


    if (

        value === null ||

        value === undefined

    ) {


        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



/* =========================================================
   CLOSE MODAL
========================================================= */

function closeModal() {


    document.getElementById(
        "detailsModal"
    ).style.display =
        "none";


    selectedOrder =
        null;

}



/* =========================================================
   CLICK OUTSIDE MODAL
========================================================= */

window.onclick =
    function(event) {


        const modal =
            document.getElementById(
                "detailsModal"
            );


        if (
            event.target ===
            modal
        ) {


            closeModal();

        }

    };



/* =========================================================
   ESC KEY
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {


        if (
            event.key ===
            "Escape"
        ) {


            closeModal();

        }

    }
);



/* =========================================================
   START
========================================================= */

loadOrders();


</script>
