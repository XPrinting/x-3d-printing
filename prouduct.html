<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>X3D Printing | Products</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {

            --bg: #080816;
            --surface: #11172a;
            --surface2: #171f38;
            --border: rgba(255,255,255,.10);

            --text: #ffffff;
            --muted: #aeb6cc;

            --primary: #8b5cf6;
            --primary2: #6d28d9;

            --green: #22c55e;
            --red: #ef4444;

        }

        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                radial-gradient(
                    circle at top right,
                    #17153b 0%,
                    #080816 45%
                ),
                var(--bg);

            color: var(--text);

            min-height: 100vh;

        }

        /* SIDEBAR */

        .sidebar {

            position: fixed;

            left: 0;
            top: 0;

            width: 250px;
            height: 100vh;

            background:
                rgba(10,12,28,.96);

            border-right:
                1px solid var(--border);

            padding: 25px 18px;

            z-index: 100;

        }

        .logo {

            font-size: 25px;

            font-weight: 800;

            padding:
                10px 12px 30px;

        }

        .logo span {

            color: var(--primary);

        }

        .menu-title {

            color: #68728a;

            font-size: 11px;

            font-weight: bold;

            text-transform: uppercase;

            padding: 0 12px;

            margin-bottom: 10px;

        }

        .menu {

            display: flex;

            flex-direction: column;

            gap: 6px;

        }

        .menu-item {

            display: flex;

            align-items: center;

            gap: 12px;

            color: var(--muted);

            padding:
                13px 14px;

            border-radius: 11px;

            cursor: pointer;

            transition: .2s;

            text-decoration: none;

        }

        .menu-item:hover,
        .menu-item.active {

            background:
                rgba(139,92,246,.16);

            color: white;

        }

        .menu-item.active {

            border-left:
                3px solid var(--primary);

        }

        .menu-icon {

            width: 24px;

            text-align: center;

        }

        /* MAIN */

        .main {

            margin-left: 250px;

            padding:
                30px 35px;

        }

        .topbar {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            margin-bottom: 30px;

            gap: 20px;

        }

        .page-title h1 {

            font-size: 30px;

            margin-bottom: 7px;

        }

        .page-title p {

            color: var(--muted);

        }

        .add-btn {

            border: none;

            background:
                linear-gradient(
                    135deg,
                    #6d28d9,
                    #8b5cf6
                );

            color: white;

            padding:
                12px 18px;

            border-radius: 10px;

            cursor: pointer;

            font-weight: bold;

            font-size: 14px;

        }

        .add-btn:hover {

            opacity: .88;

        }

        /* STATS */

        .stats {

            display: grid;

            grid-template-columns:
                repeat(3,1fr);

            gap: 18px;

            margin-bottom: 25px;

        }

        .stat-card {

            background:
                rgba(17,23,42,.92);

            border:
                1px solid var(--border);

            border-radius: 17px;

            padding: 20px;

        }

        .stat-label {

            color: var(--muted);

            font-size: 13px;

            margin-bottom: 12px;

        }

        .stat-value {

            font-size: 28px;

            font-weight: bold;

        }

        /* PRODUCTS */

        .products-card {

            background:
                rgba(17,23,42,.92);

            border:
                1px solid var(--border);

            border-radius: 20px;

            overflow: hidden;

        }

        .products-header {

            padding: 22px;

            border-bottom:
                1px solid var(--border);

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            gap: 15px;

        }

        .products-header h2 {

            font-size: 21px;

        }

        .actions {

            display: flex;

            gap: 10px;

        }

        .search {

            background: #0b1020;

            border:
                1px solid var(--border);

            color: white;

            padding:
                10px 13px;

            border-radius: 9px;

            outline: none;

            width: 250px;

        }

        .filter {

            background: #0b1020;

            border:
                1px solid var(--border);

            color: white;

            padding:
                10px 13px;

            border-radius: 9px;

            outline: none;

        }

        .table-wrapper {

            width: 100%;

            overflow-x: auto;

        }

        table {

            width: 100%;

            border-collapse:
                collapse;

            min-width: 900px;

        }

        th {

            text-align: left;

            color: #7f89a3;

            font-size: 12px;

            text-transform:
                uppercase;

            padding:
                16px 20px;

            background:
                rgba(7,10,23,.45);

            white-space:
                nowrap;

        }

        td {

            padding:
                16px 20px;

            border-top:
                1px solid var(--border);

            white-space:
                nowrap;

        }

        tr:hover td {

            background:
                rgba(139,92,246,.04);

        }

        .product-image {

            width: 55px;

            height: 55px;

            border-radius: 10px;

            object-fit: cover;

            background: #0b1020;

            border:
                1px solid var(--border);

        }

        .product-name {

            font-weight: bold;

        }

        .product-description {

            color: var(--muted);

            font-size: 12px;

            margin-top: 4px;

            max-width: 250px;

            overflow: hidden;

            text-overflow: ellipsis;

        }

        .price {

            font-weight: bold;

        }

        .category {

            color: #c4b5fd;

        }

        /* STATUS */

        .status {

            display: inline-flex;

            padding:
                6px 10px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: bold;

        }

        .active {

            background:
                rgba(34,197,94,.15);

            color:
                #4ade80;

        }

        .inactive {

            background:
                rgba(239,68,68,.15);

            color:
                #f87171;

        }

        /* BUTTONS */

        .edit-btn,
        .delete-btn {

            border: 1px solid;

            padding:
                7px 11px;

            border-radius: 8px;

            cursor: pointer;

            margin-right: 5px;

        }

        .edit-btn {

            background:
                rgba(139,92,246,.10);

            border-color:
                rgba(139,92,246,.35);

            color:
                #c4b5fd;

        }

        .delete-btn {

            background:
                rgba(239,68,68,.10);

            border-color:
                rgba(239,68,68,.30);

            color:
                #f87171;

        }

        /* MODAL */

        .modal {

            display: none;

            position: fixed;

            inset: 0;

            background:
                rgba(0,0,0,.78);

            z-index: 500;

            align-items: center;

            justify-content: center;

            padding: 20px;

        }

        .modal-box {

            width: 100%;

            max-width: 600px;

            max-height: 90vh;

            overflow-y: auto;

            background:
                #11172a;

            border:
                1px solid var(--border);

            border-radius: 20px;

            padding: 25px;

        }

        .modal-header {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            margin-bottom: 25px;

        }

        .modal-header h2 {

            font-size: 22px;

        }

        .close {

            background: transparent;

            border: none;

            color: white;

            font-size: 28px;

            cursor: pointer;

        }

        .form-group {

            margin-bottom: 17px;

        }

        .form-group label {

            display: block;

            color: var(--muted);

            font-size: 13px;

            margin-bottom: 7px;

        }

        .form-group input,
        .form-group textarea,
        .form-group select {

            width: 100%;

            background:
                #0b1020;

            border:
                1px solid var(--border);

            color: white;

            padding: 12px;

            border-radius: 9px;

            outline: none;

        }

        .form-group textarea {

            min-height: 100px;

            resize: vertical;

        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {

            border-color:
                var(--primary);

        }

        .form-row {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 15px;

        }

        .save-btn {

            width: 100%;

            margin-top: 8px;

            padding: 13px;

            border: none;

            border-radius: 9px;

            background:
                linear-gradient(
                    135deg,
                    #6d28d9,
                    #8b5cf6
                );

            color: white;

            font-weight: bold;

            cursor: pointer;

        }

        .loading,
        .empty {

            padding: 50px;

            text-align: center;

            color: var(--muted);

        }

        .error {

            padding: 30px;

            text-align: center;

            color: #f87171;

        }

        /* MOBILE */

        @media(max-width:800px) {

            .sidebar {

                position: relative;

                width: 100%;

                height: auto;

                border-right: none;

                border-bottom:
                    1px solid var(--border);

            }

            .main {

                margin-left: 0;

                padding:
                    22px 15px;

            }

            .menu {

                flex-direction: row;

                overflow-x: auto;

            }

            .menu-item {

                min-width:
                    max-content;

            }

            .menu-title {

                display: none;

            }

            .topbar {

                flex-direction:
                    column;

                align-items:
                    flex-start;

            }

            .stats {

                grid-template-columns:
                    1fr;

            }

            .products-header {

                flex-direction:
                    column;

                align-items:
                    stretch;

            }

            .actions {

                flex-direction:
                    column;

            }

            .search {

                width: 100%;

            }

            .form-row {

                grid-template-columns:
                    1fr;

            }

        }

    </style>

</head>


<body>


<!-- SIDEBAR -->

<aside class="sidebar">

    <div class="logo">
        X<span>3D</span> Admin
    </div>

    <div class="menu-title">
        Management
    </div>

    <div class="menu">

        <a
            class="menu-item"
            href="admin.html"
        >
            <span class="menu-icon">
                📊
            </span>

            Dashboard
        </a>


        <a
            class="menu-item"
            href="orders.html"
        >
            <span class="menu-icon">
                🛒
            </span>

            Orders
        </a>


        <a
            class="menu-item active"
            href="products.html"
        >
            <span class="menu-icon">
                📦
            </span>

            Products
        </a>


        <a
            class="menu-item"
            href="#"
        >
            <span class="menu-icon">
                👥
            </span>

            Customers
        </a>


        <a
            class="menu-item"
            href="#"
        >
            <span class="menu-icon">
                🎨
            </span>

            Custom Requests
        </a>

    </div>

</aside>


<!-- MAIN -->

<main class="main">


    <div class="topbar">

        <div class="page-title">

            <h1>
                Products
            </h1>

            <p>
                Manage all products in your store.
            </p>

        </div>


        <button
            class="add-btn"
            onclick="openAddProduct()"
        >
            + Add Product
        </button>

    </div>


    <!-- STATS -->

    <section class="stats">


        <div class="stat-card">

            <div class="stat-label">
                Total Products
            </div>

            <div
                class="stat-value"
                id="totalProducts"
            >
                0
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-label">
                Active Products
            </div>

            <div
                class="stat-value"
                id="activeProducts"
            >
                0
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-label">
                Inactive Products
            </div>

            <div
                class="stat-value"
                id="inactiveProducts"
            >
                0
            </div>

        </div>


    </section>


    <!-- PRODUCTS -->

    <section class="products-card">


        <div class="products-header">

            <h2>
                All Products
            </h2>


            <div class="actions">

                <input
                    class="search"
                    id="searchInput"
                    type="text"
                    placeholder="Search products..."
                    oninput="renderProducts()"
                >


                <select
                    class="filter"
                    id="statusFilter"
                    onchange="renderProducts()"
                >

                    <option value="all">
                        All Status
                    </option>

                    <option value="active">
                        Active
                    </option>

                    <option value="inactive">
                        Inactive
                    </option>

                </select>

            </div>

        </div>


        <div
            class="table-wrapper"
            id="tableContainer"
        >

            <div class="loading">
                Loading products...
            </div>

        </div>

    </section>


</main>


<!-- ADD / EDIT MODAL -->

<div
    class="modal"
    id="productModal"
>


    <div class="modal-box">


        <div class="modal-header">

            <h2 id="modalTitle">
                Add Product
            </h2>


            <button
                class="close"
                onclick="closeProductModal()"
            >
                ×
            </button>

        </div>


        <form
            id="productForm"
            onsubmit="saveProduct(event)"
        >


            <div class="form-group">

                <label>
                    Product Name
                </label>

                <input
                    type="text"
                    id="productName"
                    required
                    placeholder="Example: Custom Name Keychain"
                >

            </div>


            <div class="form-group">

                <label>
                    Description
                </label>

                <textarea
                    id="productDescription"
                    placeholder="Product description..."
                ></textarea>

            </div>


            <div class="form-row">


                <div class="form-group">

                    <label>
                        Category
                    </label>

                    <input
                        type="text"
                        id="productCategory"
                        placeholder="Accessories"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Price (EGP)
                    </label>

                    <input
                        type="number"
                        id="productPrice"
                        min="0"
                        step="0.01"
                        required
                        placeholder="80"
                    >

                </div>


            </div>


            <div class="form-group">

                <label>
                    Image URL / Path
                </label>

                <input
                    type="text"
                    id="productImage"
                    placeholder="/images/product.jpg"
                >

            </div>


            <div class="form-group">

                <label>
                    Status
                </label>

                <select
                    id="productActive"
                >

                    <option value="true">
                        Active
                    </option>

                    <option value="false">
                        Inactive
                    </option>

                </select>

            </div>


            <button
                class="save-btn"
                type="submit"
            >
                Save Product
            </button>


        </form>


    </div>

</div>


<script>


/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL =
    "https://wxezuqdktbftlkjxqcmi.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_Z1_vjXxFAUU_PAI05Hqd4w_zjopEwwH";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =========================================================
   GLOBAL
   ========================================================= */

let products = [];

let editingProductId = null;


/* =========================================================
   LOAD PRODUCTS
   ========================================================= */

async function loadProducts() {

    const container =
        document.getElementById(
            "tableContainer"
        );


    container.innerHTML = `
        <div class="loading">
            Loading products...
        </div>
    `;


    try {

        const { data, error } =
            await supabaseClient
                .from("products")
                .select("*")
                .order("id", {
                    ascending: false
                });


        if (error) {

            console.error(error);

            container.innerHTML = `
                <div class="error">
                    ❌ Failed to load products.<br><br>
                    ${escapeHtml(error.message)}
                </div>
            `;

            return;

        }


        products = data || [];


        updateStats();

        renderProducts();

    }

    catch(error) {

        console.error(error);

        container.innerHTML = `
            <div class="error">
                ❌ Something went wrong.<br><br>
                ${escapeHtml(error.message)}
            </div>
        `;

    }

}


/* =========================================================
   STATS
   ========================================================= */

function updateStats() {

    const total =
        products.length;


    const active =
        products.filter(
            product => product.active !== false
        ).length;


    const inactive =
        products.filter(
            product => product.active === false
        ).length;


    document.getElementById(
        "totalProducts"
    ).textContent = total;


    document.getElementById(
        "activeProducts"
    ).textContent = active;


    document.getElementById(
        "inactiveProducts"
    ).textContent = inactive;

}


/* =========================================================
   RENDER
   ========================================================= */

function renderProducts() {

    const container =
        document.getElementById(
            "tableContainer"
        );


    const search =
        document.getElementById(
            "searchInput"
        )
        .value
        .toLowerCase()
        .trim();


    const status =
        document.getElementById(
            "statusFilter"
        )
        .value;


    let filtered =
        [...products];


    if(search) {

        filtered =
            filtered.filter(product => {

                const name =
                    String(
                        product.name || ""
                    ).toLowerCase();


                const description =
                    String(
                        product.description || ""
                    ).toLowerCase();


                const category =
                    String(
                        product.category || ""
                    ).toLowerCase();


                return (
                    name.includes(search) ||
                    description.includes(search) ||
                    category.includes(search)
                );

            });

    }


    if(status === "active") {

        filtered =
            filtered.filter(
                product =>
                    product.active !== false
            );

    }


    if(status === "inactive") {

        filtered =
            filtered.filter(
                product =>
                    product.active === false
            );

    }


    if(filtered.length === 0) {

        container.innerHTML = `
            <div class="empty">
                No products found.
            </div>
        `;

        return;

    }


    container.innerHTML = `

        <table>

            <thead>

                <tr>

                    <th>
                        Image
                    </th>

                    <th>
                        Product
                    </th>

                    <th>
                        Category
                    </th>

                    <th>
                        Price
                    </th>

                    <th>
                        Status
                    </th>

                    <th>
                        Actions
                    </th>

                </tr>

            </thead>


            <tbody>

                ${filtered.map(product => `

                    <tr>

                        <td>

                            ${
                                product.image
                                ?
                                `
                                <img
                                    class="product-image"
                                    src="${escapeHtml(product.image)}"
                                    onerror="this.style.display='none'"
                                >
                                `
                                :
                                `
                                <div class="product-image"></div>
                                `
                            }

                        </td>


                        <td>

                            <div class="product-name">

                                ${escapeHtml(
                                    product.name
                                )}

                            </div>


                            <div
                                class="product-description"
                            >

                                ${escapeHtml(
                                    product.description ||
                                    "-"
                                )}

                            </div>

                        </td>


                        <td>

                            <span class="category">

                                ${escapeHtml(
                                    product.category ||
                                    "-"
                                )}

                            </span>

                        </td>


                        <td>

                            <span class="price">

                                EGP ${Number(
                                    product.price || 0
                                ).toLocaleString()}

                            </span>

                        </td>


                        <td>

                            ${
                                product.active !== false
                                ?
                                `
                                <span
                                    class="status active"
                                >
                                    Active
                                </span>
                                `
                                :
                                `
                                <span
                                    class="status inactive"
                                >
                                    Inactive
                                </span>
                                `
                            }

                        </td>


                        <td>

                            <button
                                class="edit-btn"
                                onclick="editProduct(${product.id})"
                            >
                                Edit
                            </button>


                            <button
                                class="delete-btn"
                                onclick="deleteProduct(${product.id})"
                            >
                                Delete
                            </button>

                        </td>

                    </tr>

                `).join("")}

            </tbody>

        </table>

    `;

}


/* =========================================================
   ADD PRODUCT
   ========================================================= */

function openAddProduct() {

    editingProductId = null;


    document.getElementById(
        "modalTitle"
    ).textContent =
        "Add Product";


    document.getElementById(
        "productForm"
    ).reset();


    document.getElementById(
        "productActive"
    ).value = "true";


    document.getElementById(
        "productModal"
    ).style.display = "flex";

}


/* =========================================================
   EDIT PRODUCT
   ========================================================= */

function editProduct(id) {

    const product =
        products.find(
            item =>
                Number(item.id) === Number(id)
        );


    if(!product) {
        return;
    }


    editingProductId =
        product.id;


    document.getElementById(
        "modalTitle"
    ).textContent =
        "Edit Product";


    document.getElementById(
        "productName"
    ).value =
        product.name || "";


    document.getElementById(
        "productDescription"
    ).value =
        product.description || "";


    document.getElementById(
        "productCategory"
    ).value =
        product.category || "";


    document.getElementById(
        "productPrice"
    ).value =
        product.price || 0;


    document.getElementById(
        "productImage"
    ).value =
        product.image || "";


    document.getElementById(
        "productActive"
    ).value =
        product.active === false
        ? "false"
        : "true";


    document.getElementById(
        "productModal"
    ).style.display = "flex";

}


/* =========================================================
   SAVE PRODUCT
   ========================================================= */

async function saveProduct(event) {

    event.preventDefault();


    const name =
        document.getElementById(
            "productName"
        ).value.trim();


    const description =
        document.getElementById(
            "productDescription"
        ).value.trim();


    const category =
        document.getElementById(
            "productCategory"
        ).value.trim();


    const price =
        Number(
            document.getElementById(
                "productPrice"
            ).value
        );


    const image =
        document.getElementById(
            "productImage"
        ).value.trim();


    const active =
        document.getElementById(
            "productActive"
        ).value === "true";


    const productData = {

        name,

        description:
            description || null,

        category:
            category || null,

        price,

        image:
            image || null,

        active,

        updated_at:
            new Date().toISOString()

    };


    try {

        let error;


        if(editingProductId) {

            const result =
                await supabaseClient
                    .from("products")
                    .update(productData)
                    .eq(
                        "id",
                        editingProductId
                    );


            error =
                result.error;

        }

        else {

            const result =
                await supabaseClient
                    .from("products")
                    .insert([
                        productData
                    ]);


            error =
                result.error;

        }


        if(error) {

            console.error(error);

            alert(
                "Failed to save product:\n\n" +
                error.message
            );

            return;

        }


        alert(
            editingProductId
            ?
            "Product updated successfully!"
            :
            "Product added successfully!"
        );


        closeProductModal();

        await loadProducts();

    }

    catch(error) {

        console.error(error);

        alert(
            "Something went wrong:\n\n" +
            error.message
        );

    }

}


/* =========================================================
   DELETE
   ========================================================= */

async function deleteProduct(id) {

    const product =
        products.find(
            item =>
                Number(item.id) === Number(id)
        );


    if(!product) {
        return;
    }


    const confirmed =
        confirm(
            `Are you sure you want to delete "${product.name}"?`
        );


    if(!confirmed) {
        return;
    }


    const { error } =
        await supabaseClient
            .from("products")
            .delete()
            .eq("id", id);


    if(error) {

        console.error(error);

        alert(
            "Failed to delete product:\n\n" +
            error.message
        );

        return;

    }


    alert(
        "Product deleted successfully!"
    );


    await loadProducts();

}


/* =========================================================
   CLOSE MODAL
   ========================================================= */

function closeProductModal() {

    document.getElementById(
        "productModal"
    ).style.display = "none";

}


window.onclick =
function(event) {

    const modal =
        document.getElementById(
            "productModal"
        );


    if(event.target === modal) {

        closeProductModal();

    }

};


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(value) {

    if(
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
