<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>X3D Printing | Products</title>

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #080816;
            --surface: #11172a;
            --surface-2: #0b1020;
            --border: rgba(255,255,255,.10);
            --text: #ffffff;
            --muted: #aeb6cc;
            --primary: #8b5cf6;
            --primary-dark: #6d28d9;
            --green: #22c55e;
            --red: #ef4444;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(
                    circle at top right,
                    #17153b 0%,
                    #080816 45%
                ),
                var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* ================================
           SIDEBAR
        ================================= */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 250px;
            height: 100vh;

            background: rgba(10,12,28,.96);
            border-right: 1px solid var(--border);

            padding: 25px 18px;

            z-index: 100;
        }

        .logo {
            font-size: 25px;
            font-weight: 800;
            padding: 10px 12px 30px;
        }

        .logo span {
            color: var(--primary);
        }

        .menu-title {
            color: #68728a;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;

            padding: 0 12px;
            margin-bottom: 10px;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;

            color: var(--muted);

            padding: 13px 14px;

            border-radius: 11px;

            cursor: pointer;
            transition: .2s;

            text-decoration: none;
        }

        .menu-item:hover {
            background: rgba(139,92,246,.16);
            color: white;
        }

        .menu-item.active {
            background: rgba(139,92,246,.16);
            color: white;

            border-left: 3px solid var(--primary);
        }

        .menu-icon {
            width: 24px;
            text-align: center;
        }

        /* ================================
           MAIN
        ================================= */

        .main {
            margin-left: 250px;
            padding: 30px 35px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 30px;
            gap: 20px;
        }

        .page-title h1 {
            font-size: 30px;
            margin-bottom: 7px;
        }

        .page-title p {
            color: var(--muted);
        }

        .refresh-btn {
            border: 1px solid rgba(139,92,246,.4);

            background:
                linear-gradient(
                    135deg,
                    #5b21b6,
                    #8b5cf6
                );

            color: white;

            padding: 11px 18px;

            border-radius: 10px;

            cursor: pointer;

            font-weight: bold;
        }

        .refresh-btn:hover {
            opacity: .9;
        }

        /* ================================
           STATS
        ================================= */

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);

            gap: 18px;

            margin-bottom: 25px;
        }

        .stat-card {
            background: rgba(17,23,42,.92);

            border: 1px solid var(--border);

            border-radius: 17px;

            padding: 20px;
        }

        .stat-label {
            color: var(--muted);

            font-size: 13px;

            margin-bottom: 12px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: bold;
        }

        /* ================================
           PRODUCTS
        ================================= */

        .products-card {
            background: rgba(17,23,42,.92);

            border: 1px solid var(--border);

            border-radius: 20px;

            padding: 22px;
        }

        .card-header {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 20px;
        }

        .card-header h2 {
            font-size: 20px;
        }

        .card-header span {
            color: var(--muted);
            font-size: 13px;
        }

        .products-grid {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(250px, 1fr)
                );

            gap: 18px;
        }

        .product-card {
            background: var(--surface-2);

            border: 1px solid var(--border);

            border-radius: 16px;

            overflow: hidden;

            transition: .2s;
        }

        .product-card:hover {
            transform: translateY(-3px);

            border-color:
                rgba(139,92,246,.5);
        }

        .product-image {
            width: 100%;
            height: 210px;

            background: #080816;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        .product-image img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        .no-image {
            color: var(--muted);
            font-size: 14px;
        }

        .product-content {
            padding: 17px;
        }

        .product-name {
            font-size: 18px;

            font-weight: bold;

            margin-bottom: 8px;
        }

        .product-description {
            color: var(--muted);

            font-size: 13px;

            line-height: 1.5;

            min-height: 40px;

            margin-bottom: 12px;
        }

        .product-category {
            display: inline-block;

            background:
                rgba(139,92,246,.15);

            color:
                #c4b5fd;

            padding:
                5px 9px;

            border-radius:
                20px;

            font-size:
                11px;

            margin-bottom:
                14px;
        }

        .product-bottom {
            display: flex;

            justify-content:
                space-between;

            align-items:
                center;
        }

        .product-price {
            font-size: 19px;

            font-weight: bold;

            color: #ffffff;
        }

        .product-status {
            padding: 5px 9px;

            border-radius: 20px;

            font-size: 11px;

            font-weight: bold;
        }

        .active-status {
            background:
                rgba(34,197,94,.15);

            color:
                #4ade80;
        }

        .inactive-status {
            background:
                rgba(239,68,68,.15);

            color:
                #f87171;
        }

        /* ================================
           LOADING
        ================================= */

        .loading {
            text-align: center;

            color: var(--muted);

            padding: 50px;

            grid-column: 1 / -1;
        }

        .error {
            text-align: center;

            color: #f87171;

            padding: 40px;

            grid-column: 1 / -1;

            line-height: 1.7;
        }

        .empty {
            text-align: center;

            color: var(--muted);

            padding: 50px;

            grid-column: 1 / -1;
        }

        /* ================================
           MOBILE
        ================================= */

        @media (max-width: 1000px) {

            .stats {
                grid-template-columns:
                    repeat(2, 1fr);
            }

        }

        @media (max-width: 800px) {

            .sidebar {
                position: relative;

                width: 100%;

                height: auto;

                border-right: none;

                border-bottom:
                    1px solid var(--border);
            }

            .main {
                margin-left: 0;

                padding: 22px 15px;
            }

            .menu {
                flex-direction: row;

                overflow-x: auto;
            }

            .menu-item {
                min-width: max-content;
            }

            .menu-title {
                display: none;
            }

            .topbar {
                flex-direction: column;

                align-items: flex-start;
            }
        }

        @media (max-width: 550px) {

            .stats {
                grid-template-columns: 1fr;
            }

            .products-grid {
                grid-template-columns: 1fr;
            }
        }

    </style>

</head>

<body>

    <!-- ================================
         SIDEBAR
    ================================= -->

    <aside class="sidebar">

        <div class="logo">
            X<span>3D</span> Admin
        </div>

        <div class="menu-title">
            Management
        </div>

        <div class="menu">

            <!-- Dashboard -->

            <a
                class="menu-item"
                href="admin.html"
            >

                <span class="menu-icon">
                    📊
                </span>

                Dashboard

            </a>


            <!-- Orders -->

            <a
                class="menu-item"
                href="orders.html"
            >

                <span class="menu-icon">
                    🛒
                </span>

                Orders

            </a>


            <!-- Products -->

            <a
                class="menu-item active"
                href="product.html"
            >

                <span class="menu-icon">
                    📦
                </span>

                Products

            </a>


            <!-- Customers -->

            <a
                class="menu-item"
                href="#customers"
            >

                <span class="menu-icon">
                    👥
                </span>

                Customers

            </a>


            <!-- Custom Requests -->

            <a
                class="menu-item"
                href="#custom"
            >

                <span class="menu-icon">
                    🎨
                </span>

                Custom Requests

            </a>

        </div>

    </aside>


    <!-- ================================
         MAIN
    ================================= -->

    <main class="main">

        <div class="topbar">

            <div class="page-title">

                <h1>
                    Products
                </h1>

                <p>
                    Manage your X3D Printing products.
                </p>

            </div>


            <button
                class="refresh-btn"
                onclick="loadProducts()"
            >

                ↻ Refresh

            </button>

        </div>


        <!-- ================================
             STATS
        ================================= -->

        <section class="stats">

            <div class="stat-card">

                <div class="stat-label">
                    Total Products
                </div>

                <div
                    class="stat-value"
                    id="totalProducts"
                >
                    0
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-label">
                    Active Products
                </div>

                <div
                    class="stat-value"
                    id="activeProducts"
                >
                    0
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-label">
                    Categories
                </div>

                <div
                    class="stat-value"
                    id="totalCategories"
                >
                    0
                </div>

            </div>

        </section>


        <!-- ================================
             PRODUCTS CARD
        ================================= -->

        <section class="products-card">

            <div class="card-header">

                <h2>
                    All Products
                </h2>

                <span id="productsCount">
                    Loading...
                </span>

            </div>


            <div
                class="products-grid"
                id="productsGrid"
            >

                <div class="loading">

                    Loading products...

                </div>

            </div>

        </section>

    </main>


    <!-- ================================
         JAVASCRIPT
    ================================= -->

    <script>

        /* =================================
           SUPABASE
        ================================= */

        const SUPABASE_URL =
            "https://wxezuqdktbftlkjxqcmi.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_Z1_vjXxFAUU_PAI05Hqd4w_zjopEwwH";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );


        /* =================================
           LOAD PRODUCTS
        ================================= */

        async function loadProducts() {

            const grid =
                document.getElementById(
                    "productsGrid"
                );

            grid.innerHTML = `
                <div class="loading">
                    Loading products...
                </div>
            `;


            try {

                const result =
                    await supabaseClient
                        .from("products")
                        .select(
                            "id,name,description,category,price,image,active"
                        )
                        .order(
                            "id",
                            {
                                ascending: true
                            }
                        );


                if (result.error) {

                    throw result.error;

                }


                const products =
                    result.data || [];


                /* =========================
                   STATS
                ========================= */

                const activeProducts =
                    products.filter(
                        product =>
                            product.active !== false
                    );


                const categories =
                    new Set(
                        products
                            .map(
                                product =>
                                    product.category
                            )
                            .filter(Boolean)
                    );


                document
                    .getElementById(
                        "totalProducts"
                    )
                    .textContent =
                        products.length;


                document
                    .getElementById(
                        "activeProducts"
                    )
                    .textContent =
                        activeProducts.length;


                document
                    .getElementById(
                        "totalCategories"
                    )
                    .textContent =
                        categories.size;


                document
                    .getElementById(
                        "productsCount"
                    )
                    .textContent =
                        `${products.length} product${products.length === 1 ? "" : "s"}`;


                /* =========================
                   EMPTY
                ========================= */

                if (!products.length) {

                    grid.innerHTML = `
                        <div class="empty">

                            📦

                            <br><br>

                            No products found.

                        </div>
                    `;

                    return;

                }


                /* =========================
                   RENDER
                ========================= */

                grid.innerHTML =
                    products
                        .map(
                            product =>
                                createProductCard(
                                    product
                                )
                        )
                        .join("");


            } catch (error) {

                console.error(
                    "Products Error:",
                    error
                );


                grid.innerHTML = `

                    <div class="error">

                        ❌ Failed to load products.

                        <br><br>

                        ${escapeHtml(
                            error.message ||
                            "Unknown error"
                        )}

                    </div>

                `;

            }

        }


        /* =================================
           PRODUCT CARD
        ================================= */

        function createProductCard(product) {

            const image =
                product.image
                    ? getImageUrl(product.image)
                    : "";


            const isActive =
                product.active !== false;


            return `

                <div class="product-card">

                    <div class="product-image">

                        ${
                            image
                                ? `
                                    <img
                                        src="${escapeHtml(image)}"
                                        alt="${escapeHtml(product.name || "Product")}"
                                        onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=&quot;no-image&quot;>Image not found</div>';"
                                    >
                                `
                                : `
                                    <div class="no-image">
                                        No image
                                    </div>
                                `
                        }

                    </div>


                    <div class="product-content">

                        <div class="product-name">

                            ${escapeHtml(
                                product.name ||
                                "Unnamed Product"
                            )}

                        </div>


                        <div class="product-description">

                            ${escapeHtml(
                                product.description ||
                                "No description available."
                            )}

                        </div>


                        ${
                            product.category
                                ? `
                                    <div class="product-category">

                                        ${escapeHtml(
                                            product.category
                                        )}

                                    </div>
                                `
                                : ""
                        }


                        <div class="product-bottom">

                            <div class="product-price">

                                EGP
                                ${Number(
                                    product.price || 0
                                ).toLocaleString()}

                            </div>


                            <div
                                class="product-status ${
                                    isActive
                                        ? "active-status"
                                        : "inactive-status"
                                }"
                            >

                                ${
                                    isActive
                                        ? "Active"
                                        : "Inactive"
                                }

                            </div>

                        </div>

                    </div>

                </div>

            `;

        }


        /* =================================
           IMAGE URL
        ================================= */

        function getImageUrl(imagePath) {

            const value =
                String(imagePath)
                    .trim();


            /*
             * لو الصورة مكتوبة كـ URL كامل
             */

            if (
                value.startsWith(
                    "http://"
                ) ||
                value.startsWith(
                    "https://"
                )
            ) {

                return value;

            }


            /*
             * الصور الموجودة في Root
             *
             * مثال:
             * 01-custom-name-keychain.jpeg
             */

            if (
                !value.startsWith("/")
            ) {

                return "../" + value;

            }


            return value;

        }


        /* =================================
           ESCAPE HTML
        ================================= */

        function escapeHtml(value) {

            if (
                value === null ||
                value === undefined
            ) {

                return "";

            }


            return String(value)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /* =================================
           START
        ================================= */

        loadProducts();

    </script>

</body>

</html>
