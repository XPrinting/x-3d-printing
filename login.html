<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>X3D Printing | Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg:#080816;
    --surface:#11172a;
    --surface2:#0b1020;
    --border:rgba(255,255,255,.10);
    --text:#fff;
    --muted:#aeb6cc;
    --primary:#8b5cf6;
}

body{

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        radial-gradient(
            circle at top right,
            #17153b 0%,
            #080816 50%
        ),
        var(--bg);

    color:var(--text);

    padding:20px;
}

.auth-card{

    width:100%;

    max-width:430px;

    background:
        rgba(17,23,42,.95);

    border:
        1px solid var(--border);

    border-radius:22px;

    padding:32px;

    box-shadow:
        0 20px 60px rgba(0,0,0,.35);
}

.logo{

    text-align:center;

    font-size:30px;

    font-weight:800;

    margin-bottom:8px;
}

.logo span{
    color:var(--primary);
}

.subtitle{

    text-align:center;

    color:var(--muted);

    margin-bottom:28px;
}

.tabs{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:6px;

    background:var(--surface2);

    padding:5px;

    border-radius:11px;

    margin-bottom:25px;
}

.tab{

    border:none;

    background:transparent;

    color:var(--muted);

    padding:11px;

    border-radius:8px;

    cursor:pointer;

    font-weight:bold;
}

.tab.active{

    background:
        rgba(139,92,246,.18);

    color:#fff;
}

.form{

    display:flex;

    flex-direction:column;

    gap:15px;
}

.field{

    display:flex;

    flex-direction:column;

    gap:7px;
}

label{

    color:var(--muted);

    font-size:13px;
}

input{

    width:100%;

    background:#0b1020;

    border:
        1px solid var(--border);

    color:#fff;

    padding:13px;

    border-radius:9px;

    outline:none;

    font-size:14px;
}

input:focus{

    border-color:
        var(--primary);
}

.submit{

    margin-top:5px;

    width:100%;

    border:none;

    border-radius:10px;

    padding:14px;

    background:
        linear-gradient(
            135deg,
            #6d28d9,
            #8b5cf6
        );

    color:#fff;

    font-weight:bold;

    cursor:pointer;
}

.submit:disabled{

    opacity:.6;

    cursor:not-allowed;
}

.message{

    display:none;

    margin-bottom:15px;

    padding:12px;

    border-radius:9px;

    font-size:13px;

    text-align:center;
}

.message.error{

    display:block;

    background:
        rgba(239,68,68,.12);

    color:#f87171;

    border:
        1px solid rgba(239,68,68,.25);
}

.message.success{

    display:block;

    background:
        rgba(34,197,94,.12);

    color:#4ade80;

    border:
        1px solid rgba(34,197,94,.25);
}

.hidden{
    display:none;
}

</style>

</head>

<body>

<div class="auth-card">

    <div class="logo">
        X<span>3D</span>
    </div>

    <div class="subtitle">
        Welcome to X3D Printing
    </div>

    <div class="tabs">

        <button
            class="tab active"
            id="loginTab"
            onclick="showLogin()"
        >
            Login
        </button>

        <button
            class="tab"
            id="registerTab"
            onclick="showRegister()"
        >
            Register
        </button>

    </div>

    <div
        id="message"
        class="message"
    ></div>


    <!-- LOGIN -->

    <form
        id="loginForm"
        class="form"
        onsubmit="login(event)"
    >

        <div class="field">

            <label>Email</label>

            <input
                id="loginEmail"
                type="email"
                placeholder="you@example.com"
                required
            >

        </div>

        <div class="field">

            <label>Password</label>

            <input
                id="loginPassword"
                type="password"
                placeholder="Your password"
                required
            >

        </div>

        <button
            class="submit"
            id="loginButton"
            type="submit"
        >
            Login
        </button>

    </form>


    <!-- REGISTER -->

    <form
        id="registerForm"
        class="form hidden"
        onsubmit="register(event)"
    >

        <div class="field">

            <label>Full Name</label>

            <input
                id="registerName"
                type="text"
                placeholder="Your full name"
                required
            >

        </div>

        <div class="field">

            <label>Phone</label>

            <input
                id="registerPhone"
                type="tel"
                placeholder="01xxxxxxxxx"
                required
            >

        </div>

        <div class="field">

            <label>Email</label>

            <input
                id="registerEmail"
                type="email"
                placeholder="you@example.com"
                required
            >

        </div>

        <div class="field">

            <label>Password</label>

            <input
                id="registerPassword"
                type="password"
                placeholder="At least 6 characters"
                minlength="6"
                required
            >

        </div>

        <button
            class="submit"
            id="registerButton"
            type="submit"
        >
            Create Account
        </button>

    </form>

</div>


<script>

const SUPABASE_URL =
    "https://wxezuqdktbftlkjxqcmi.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_Z1_vjXxFAUU_PAI05Hqd4w_zjopEwwH";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* ===============================
   TABS
=============================== */

function showLogin(){

    document
        .getElementById("loginForm")
        .classList.remove("hidden");

    document
        .getElementById("registerForm")
        .classList.add("hidden");

    document
        .getElementById("loginTab")
        .classList.add("active");

    document
        .getElementById("registerTab")
        .classList.remove("active");

    clearMessage();

}


function showRegister(){

    document
        .getElementById("loginForm")
        .classList.add("hidden");

    document
        .getElementById("registerForm")
        .classList.remove("hidden");

    document
        .getElementById("loginTab")
        .classList.remove("active");

    document
        .getElementById("registerTab")
        .classList.add("active");

    clearMessage();

}


/* ===============================
   MESSAGE
=============================== */

function showMessage(
    text,
    type
){

    const box =
        document.getElementById(
            "message"
        );

    box.textContent = text;

    box.className =
        "message " + type;

}


function clearMessage(){

    const box =
        document.getElementById(
            "message"
        );

    box.textContent = "";

    box.className =
        "message";

}


/* ===============================
   REGISTER
=============================== */

async function register(event){

    event.preventDefault();

    clearMessage();

    const button =
        document.getElementById(
            "registerButton"
        );

    const name =
        document
            .getElementById(
                "registerName"
            )
            .value
            .trim();

    const phone =
        document
            .getElementById(
                "registerPhone"
            )
            .value
            .trim();

    const email =
        document
            .getElementById(
                "registerEmail"
            )
            .value
            .trim();

    const password =
        document
            .getElementById(
                "registerPassword"
            )
            .value;


    if(
        password.length < 6
    ){

        showMessage(
            "Password must be at least 6 characters.",
            "error"
        );

        return;

    }


    button.disabled = true;

    button.textContent =
        "Creating Account...";


    try{

        const {
            data,
            error
        } =
            await supabaseClient
                .auth
                .signUp({

                    email:
                        email,

                    password:
                        password

                });


        if(error){

            throw error;

        }


        if(
            !data.user
        ){

            throw new Error(
                "Account could not be created."
            );

        }


        /*
         * Create customer profile
         */

        const {
            error:
                profileError
        } =
            await supabaseClient
                .from("profiles")
                .insert({

                    id:
                        data.user.id,

                    full_name:
                        name,

                    phone:
                        phone

                });


        if(profileError){

            console.error(
                "Profile error:",
                profileError
            );

        }


        /*
         * Email confirmation may be enabled
         */

        if(
            !data.session
        ){

            showMessage(
                "Account created! Please check your email to confirm your account.",
                "success"
            );

        }
        else{

            showMessage(
                "Account created successfully!",
                "success"
            );

            setTimeout(
                () => {

                    window.location.href =
                        "home.html";

                },
                1000
            );

        }

    }
    catch(error){

        console.error(
            "Register error:",
            error
        );

        showMessage(
            error.message ||
            "Registration failed.",
            "error"
        );

    }
    finally{

        button.disabled =
            false;

        button.textContent =
            "Create Account";

    }

}


/* ===============================
   LOGIN
=============================== */

async function login(event){

    event.preventDefault();

    clearMessage();

    const button =
        document.getElementById(
            "loginButton"
        );

    const email =
        document
            .getElementById(
                "loginEmail"
            )
            .value
            .trim();

    const password =
        document
            .getElementById(
                "loginPassword"
            )
            .value;


    button.disabled = true;

    button.textContent =
        "Logging in...";


    try{

        const {
            data,
            error
        } =
            await supabaseClient
                .auth
                .signInWithPassword({

                    email:
                        email,

                    password:
                        password

                });


        if(error){

            throw error;

        }


        if(
            !data.user
        ){

            throw new Error(
                "Login failed."
            );

        }


        showMessage(
            "Login successful!",
            "success"
        );


        setTimeout(
            () => {

                window.location.href =
                    "home.html";

            },
            700
        );

    }
    catch(error){

        console.error(
            "Login error:",
            error
        );

        showMessage(
            error.message ||
            "Login failed.",
            "error"
        );

    }
    finally{

        button.disabled =
            false;

        button.textContent =
            "Login";

    }

}


/* ===============================
   CHECK EXISTING SESSION
=============================== */

async function checkSession(){

    const {
        data
    } =
        await supabaseClient
            .auth
            .getSession();


    if(
        data &&
        data.session
    ){

        /*
         * User is already logged in.
         * You can change this later
         * to your actual homepage.
         */

        window.location.href =
            "home.html";

    }

}


checkSession();

</script>

</body>

</html>
