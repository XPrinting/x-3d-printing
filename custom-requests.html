<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>X3D Printing | Custom Requests</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{
  --bg:#070914;
  --card:#0f1222;
  --card2:#15182b;
  --text:#f5f7ff;
  --muted:#9ca3b8;
  --primary:#8b5cf6;
  --primary2:#6d28d9;
  --border:#252a40;
  --danger:#ef4444;
  --success:#22c55e;
  --warning:#f59e0b;
  --info:#3b82f6;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(
      circle at top left,
      rgba(139,92,246,.12),
      transparent 35%
    ),
    linear-gradient(135deg,#070914,#0c1020);
  color:var(--text);
  min-height:100vh;
}

a{
  text-decoration:none;
  color:inherit;
}

.container{
  width:min(1400px,94%);
  margin:auto;
}


/* =========================
   HEADER
========================= */

header{
  position:sticky;
  top:0;
  z-index:20;

  background:rgba(7,9,20,.92);
  backdrop-filter:blur(15px);

  border-bottom:1px solid var(--border);
}

.nav{
  min-height:74px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:20px;
}

.logo{
  font-size:25px;
  font-weight:800;
  letter-spacing:.5px;
}

.logo span{
  color:var(--primary);
}

.nav-actions{
  display:flex;
  gap:10px;
  align-items:center;
}

.nav-btn{
  border:1px solid var(--border);
  background:#111526;
  color:#fff;

  padding:10px 15px;

  border-radius:10px;

  font-weight:700;

  cursor:pointer;
}

.nav-btn:hover{
  border-color:var(--primary);
}


/* =========================
   MAIN
========================= */

main{
  padding:35px 0 70px;
}

.page-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;

  gap:20px;

  margin-bottom:25px;
}

.page-head h1{
  margin:0 0 8px;
  font-size:clamp(28px,4vw,40px);
}

.page-head p{
  margin:0;
  color:var(--muted);
}

.refresh-btn{
  border:0;

  background:
    linear-gradient(
      135deg,
      var(--primary),
      var(--primary2)
    );

  color:white;

  padding:12px 18px;

  border-radius:11px;

  font-weight:800;

  cursor:pointer;
}

.refresh-btn:disabled{
  opacity:.5;
  cursor:not-allowed;
}


/* =========================
   STATS
========================= */

.stats{
  display:grid;

  grid-template-columns:
    repeat(4,minmax(0,1fr));

  gap:15px;

  margin-bottom:25px;
}

.stat{
  background:rgba(15,18,34,.92);

  border:1px solid var(--border);

  border-radius:16px;

  padding:20px;
}

.stat-label{
  color:var(--muted);
  font-size:13px;
  margin-bottom:8px;
}

.stat-value{
  font-size:28px;
  font-weight:800;
}


/* =========================
   FILTERS
========================= */

.filters{
  background:rgba(15,18,34,.92);

  border:1px solid var(--border);

  border-radius:16px;

  padding:18px;

  display:grid;

  grid-template-columns:
    2fr 1fr auto;

  gap:12px;

  margin-bottom:20px;
}

input,
select{

  width:100%;

  border:1px solid var(--border);

  background:#0a0d19;

  color:#fff;

  border-radius:10px;

  padding:12px 13px;

  outline:none;

  font:inherit;
}

input:focus,
select:focus{
  border-color:var(--primary);

  box-shadow:
    0 0 0 3px
    rgba(139,92,246,.12);
}

.clear-btn{
  border:1px solid var(--border);

  background:#111526;

  color:#fff;

  border-radius:10px;

  padding:0 18px;

  cursor:pointer;

  font-weight:700;
}


/* =========================
   REQUESTS
========================= */

.requests{
  display:flex;
  flex-direction:column;
  gap:15px;
}

.request-card{

  background:rgba(15,18,34,.94);

  border:1px solid var(--border);

  border-radius:17px;

  overflow:hidden;

  box-shadow:
    0 12px 35px rgba(0,0,0,.16);
}

.request-top{

  padding:18px 20px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:15px;

  border-bottom:1px solid var(--border);
}

.request-title{
  font-size:18px;
  font-weight:800;
}

.request-id{
  color:var(--muted);
  font-family:monospace;
  font-size:12px;
  margin-top:5px;
}

.status{

  display:inline-flex;

  align-items:center;

  justify-content:center;

  padding:7px 11px;

  border-radius:999px;

  font-size:12px;

  font-weight:800;

  white-space:nowrap;
}

.status-pending{
  background:rgba(245,158,11,.12);
  color:#fbbf24;
}

.status-reviewing{
  background:rgba(59,130,246,.12);
  color:#60a5fa;
}

.status-approved{
  background:rgba(34,197,94,.12);
  color:#4ade80;
}

.status-rejected{
  background:rgba(239,68,68,.12);
  color:#f87171;
}

.status-completed{
  background:rgba(139,92,246,.14);
  color:#c4b5fd;
}

.request-body{
  padding:20px;
}

.info-grid{

  display:grid;

  grid-template-columns:
    repeat(3,minmax(0,1fr));

  gap:15px;

  margin-bottom:18px;
}

.info-box{

  background:#0a0d19;

  border:1px solid var(--border);

  border-radius:11px;

  padding:13px;
}

.info-label{

  color:var(--muted);

  font-size:11px;

  margin-bottom:6px;

  text-transform:uppercase;

  letter-spacing:.5px;
}

.info-value{
  font-size:14px;
  font-weight:700;
  word-break:break-word;
}

.description{

  background:#0a0d19;

  border:1px solid var(--border);

  border-radius:11px;

  padding:15px;

  margin-bottom:15px;
}

.description-title{

  color:var(--muted);

  font-size:12px;

  font-weight:700;

  margin-bottom:7px;
}

.description-text{

  font-size:14px;

  line-height:1.7;

  white-space:pre-wrap;
}

.actions{

  display:flex;

  flex-wrap:wrap;

  gap:9px;

  padding-top:15px;

  border-top:1px solid var(--border);
}

.action-btn{

  display:inline-flex;

  align-items:center;

  justify-content:center;

  gap:7px;

  border:1px solid var(--border);

  background:#111526;

  color:#fff;

  border-radius:9px;

  padding:9px 13px;

  font-size:13px;

  font-weight:700;

  cursor:pointer;
}

.action-btn:hover{
  border-color:var(--primary);
}

.action-btn.whatsapp{
  background:#25D366;
  border-color:#25D366;
  color:#06140a;
}

.action-btn.model{
  background:rgba(139,92,246,.12);
  border-color:#4c3481;
}

.action-btn.image{
  background:rgba(59,130,246,.12);
  border-color:#234f91;
}

.status-select{
  width:auto;
  min-width:150px;
}


/* =========================
   EMPTY / LOADING / ERROR
========================= */

.message{

  background:rgba(15,18,34,.92);

  border:1px solid var(--border);

  border-radius:16px;

  padding:35px 20px;

  text-align:center;

  color:var(--muted);
}

.loading{
  display:none;
}

.error{

  display:none;

  background:rgba(239,68,68,.10);

  border:1px solid rgba(239,68,68,.35);

  color:#fecaca;

  border-radius:12px;

  padding:14px 16px;

  margin-bottom:20px;

  line-height:1.6;
}


/* =========================
   FOOTER
========================= */

footer{
  text-align:center;

  color:var(--muted);

  font-size:12px;

  padding:20px 0;
}


/* =========================
   RTL
========================= */

[dir="rtl"]{
  font-family:Arial,Tahoma,sans-serif;
}

[dir="rtl"] input,
[dir="rtl"] select{
  text-align:right;
}


/* =========================
   MOBILE
========================= */

@media(max-width:900px){

  .stats{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }

  .info-grid{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }

  .filters{
    grid-template-columns:1fr 1fr;
  }

  .clear-btn{
    min-height:45px;
  }

}


@media(max-width:600px){

  .nav{
    min-height:65px;
  }

  .logo{
    font-size:21px;
  }

  .page-head{
    flex-direction:column;
  }

  .refresh-btn{
    width:100%;
  }

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .filters{
    grid-template-columns:1fr;
  }

  .info-grid{
    grid-template-columns:1fr;
  }

  .request-top{
    align-items:flex-start;
    flex-direction:column;
  }

  .status-select{
    width:100%;
  }

}

</style>
</head>


<body>


<header>

  <div class="container nav">

    <a
      class="logo"
      href="admin.html">

      X3D <span>Printing</span>

    </a>


    <div class="nav-actions">

      <a
        class="nav-btn"
        href="admin.html">

        ← Dashboard

      </a>

    </div>

  </div>

</header>



<main class="container">


  <div class="page-head">

    <div>

      <h1>
        Custom Requests
      </h1>

      <p>
        Manage customer 3D printing requests
      </p>

    </div>


    <button
      id="refreshBtn"
      class="refresh-btn"
      type="button">

      ↻ Refresh

    </button>

  </div>



  <div
    id="errorBox"
    class="error">
  </div>



  <!-- STATS -->

  <div class="stats">

    <div class="stat">

      <div class="stat-label">
        Total Requests
      </div>

      <div
        id="totalCount"
        class="stat-value">

        0

      </div>

    </div>


    <div class="stat">

      <div class="stat-label">
        Pending
      </div>

      <div
        id="pendingCount"
        class="stat-value">

        0

      </div>

    </div>


    <div class="stat">

      <div class="stat-label">
        Reviewing
      </div>

      <div
        id="reviewingCount"
        class="stat-value">

        0

      </div>

    </div>


    <div class="stat">

      <div class="stat-label">
        Completed
      </div>

      <div
        id="completedCount"
        class="stat-value">

        0

      </div>

    </div>

  </div>



  <!-- FILTERS -->

  <div class="filters">

    <input
      id="searchInput"
      type="search"
      placeholder="Search by name, phone or project...">


    <select id="statusFilter">

      <option value="">
        All Statuses
      </option>

      <option value="pending">
        Pending
      </option>

      <option value="reviewing">
        Reviewing
      </option>

      <option value="approved">
        Approved
      </option>

      <option value="rejected">
        Rejected
      </option>

      <option value="completed">
        Completed
      </option>

    </select>


    <button
      id="clearBtn"
      class="clear-btn"
      type="button">

      Clear

    </button>

  </div>



  <!-- REQUESTS -->

  <div
    id="loading"
    class="message loading">

    Loading custom requests...

  </div>


  <div
    id="empty"
    class="message"
    style="display:none;">

    No custom requests found.

  </div>


  <div
    id="requests"
    class="requests">
  </div>


</main>



<footer>

  ©️ <span id="year"></span> X3D Printing

</footer>



<script>


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  'https://wxezuqdktbftlkjxqcmi.supabase.co';

const SUPABASE_KEY =
  'sb_publishable_Z1_vjXxFAUU_PAI05Hqd4w_zjopEwwH';


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================
   STATE
========================= */

let allRequests = [];


/* =========================
   ELEMENTS
========================= */

const requestsEl =
  document.getElementById('requests');

const loadingEl =
  document.getElementById('loading');

const emptyEl =
  document.getElementById('empty');

const errorEl =
  document.getElementById('errorBox');

const searchInput =
  document.getElementById('searchInput');

const statusFilter =
  document.getElementById('statusFilter');

const refreshBtn =
  document.getElementById('refreshBtn');


/* =========================
   ERROR
========================= */

function showError(message){

  errorEl.textContent =
    message;

  errorEl.style.display =
    'block';

}

function clearError(){

  errorEl.textContent =
    '';

  errorEl.style.display =
    'none';

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

  if(value === null || value === undefined){
    return '';
  }

  return String(value)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');

}


/* =========================
   STATUS
========================= */

function normalizeStatus(status){

  return String(status || 'pending')
    .trim()
    .toLowerCase();

}


function statusClass(status){

  const s =
    normalizeStatus(status);

  if(s === 'reviewing'){
    return 'status-reviewing';
  }

  if(s === 'approved'){
    return 'status-approved';
  }

  if(s === 'rejected'){
    return 'status-rejected';
  }

  if(s === 'completed'){
    return 'status-completed';
  }

  return 'status-pending';

}


function statusLabel(status){

  const s =
    normalizeStatus(status);

  return (
    s.charAt(0).toUpperCase() +
    s.slice(1)
  );

}


/* =========================
   DATE
========================= */

function formatDate(date){

  if(!date){
    return '-';
  }

  const d =
    new Date(date);

  if(Number.isNaN(d.getTime())){
    return '-';
  }

  return d.toLocaleString(
    'en-EG',
    {
      year:'numeric',
      month:'short',
      day:'numeric',
      hour:'2-digit',
      minute:'2-digit'
    }
  );

}


/* =========================
   WHATSAPP
========================= */

function whatsappLink(request){

  const phone =
    String(request.phone || '')
      .replace(/\D/g,'');

  if(!phone){
    return '#';
  }

  const message =
`Hello ${request.customer_name || ''},

Regarding your custom 3D printing request:

Request ID: ${request.id}
Project: ${request.project_title || ''}

Please let me know if you have any questions.`;

  return (
    'https://wa.me/' +
    phone +
    '?text=' +
    encodeURIComponent(message)
  );

}


/* =========================
   LOAD REQUESTS
========================= */

async function loadRequests(){

  clearError();

  loadingEl.style.display =
    'block';

  emptyEl.style.display =
    'none';

  requestsEl.innerHTML =
    '';

  refreshBtn.disabled =
    true;


  try{

    const {
      data,
      error
    } =
      await supabaseClient
        .from('custom_requests')
        .select('*')
        .order(
          'created_at',
          {
            ascending:false
          }
        );


    if(error){

      throw error;

    }


    allRequests =
      data || [];


    updateStats();

    renderRequests();


  }catch(error){

    console.error(error);

    showError(
      'Could not load custom requests. ' +
      (error?.message || '')
    );

  }finally{

    loadingEl.style.display =
      'none';

    refreshBtn.disabled =
      false;

  }

}


/* =========================
   STATS
========================= */

function updateStats(){

  const total =
    allRequests.length;

  const pending =
    allRequests.filter(
      r =>
        normalizeStatus(r.status) ===
        'pending'
    ).length;

  const reviewing =
    allRequests.filter(
      r =>
        normalizeStatus(r.status) ===
        'reviewing'
    ).length;

  const completed =
    allRequests.filter(
      r =>
        normalizeStatus(r.status) ===
        'completed'
    ).length;


  document.getElementById(
    'totalCount'
  ).textContent =
    total;


  document.getElementById(
    'pendingCount'
  ).textContent =
    pending;


  document.getElementById(
    'reviewingCount'
  ).textContent =
    reviewing;


  document.getElementById(
    'completedCount'
  ).textContent =
    completed;

}


/* =========================
   FILTER
========================= */

function getFilteredRequests(){

  const search =
    searchInput.value
      .trim()
      .toLowerCase();

  const status =
    statusFilter.value;


  return allRequests.filter(
    request => {

      const text =
        [
          request.customer_name,
          request.phone,
          request.project_title,
          request.governorate,
          request.area
        ]
        .join(' ')
        .toLowerCase();


      const matchesSearch =
        !search ||
        text.includes(search);


      const matchesStatus =
        !status ||
        normalizeStatus(request.status) ===
        status;


      return (
        matchesSearch &&
        matchesStatus
      );

    }
  );

}


/* =========================
   RENDER
========================= */

function renderRequests(){

  const filtered =
    getFilteredRequests();


  requestsEl.innerHTML =
    '';


  if(filtered.length === 0){

    emptyEl.style.display =
      'block';

    return;

  }


  emptyEl.style.display =
    'none';


  filtered.forEach(
    request => {

      const card =
        document.createElement('div');

      card.className =
        'request-card';


      const status =
        normalizeStatus(
          request.status
        );


      card.innerHTML = `

        <div class="request-top">

          <div>

            <div class="request-title">

              ${escapeHtml(
                request.project_title ||
                'Custom Print Request'
              )}

            </div>

            <div class="request-id">

              #${escapeHtml(
                request.id
              )}

              ·

              ${escapeHtml(
                formatDate(
                  request.created_at
                )
              )}

            </div>

          </div>


          <span
            class="status ${statusClass(status)}">

            ${escapeHtml(
              statusLabel(status)
            )}

          </span>

        </div>


        <div class="request-body">


          <div class="info-grid">


            <div class="info-box">

              <div class="info-label">
                Customer
              </div>

              <div class="info-value">

                ${escapeHtml(
                  request.customer_name ||
                  '-'
                )}

              </div>

            </div>


            <div class="info-box">

              <div class="info-label">
                Phone
              </div>

              <div class="info-value">

                ${escapeHtml(
                  request.phone ||
                  '-'
                )}

              </div>

            </div>


            <div class="info-box">

              <div class="info-label">
                Quantity
              </div>

              <div class="info-value">

                ${escapeHtml(
                  request.quantity ??
                  '-'
                )}

              </div>

            </div>


            <div class="info-box">

              <div class="info-label">
                Material
              </div>

              <div class="info-value">

                ${escapeHtml(
                  request.material ||
                  '-'
                )}

              </div>

            </div>


            <div class="info-box">

              <div class="info-label">
                Color
              </div>

              <div class="info-value">

                ${escapeHtml(
                  request.color ||
                  '-'
                )}

              </div>

            </div>


            <div class="info-box">

              <div class="info-label">
                Dimensions
              </div>

              <div class="info-value">

                ${escapeHtml(
                  request.dimensions ||
                  '-'
                )}

              </div>

            </div>


            <div class="info-box">

              <div class="info-label">
                Governorate
              </div>

              <div class="info-value">

                ${escapeHtml(
                  request.governorate ||
                  '-'
                )}

              </div>

            </div>


            <div class="info-box">

              <div class="info-label">
                Area
              </div>

              <div class="info-value">

                ${escapeHtml(
                  request.area ||
                  '-'
                )}

              </div>

            </div>


            <div class="info-box">

              <div class="info-label">
                Address
              </div>

              <div class="info-value">

                ${escapeHtml(
                  request.address ||
                  '-'
                )}

              </div>

            </div>


          </div>


          <div class="description">

            <div class="description-title">
              PROJECT DESCRIPTION
            </div>

            <div class="description-text">

              ${escapeHtml(
                request.description ||
                '-'
              )}

            </div>

          </div>


          ${
            request.notes
              ? `

                <div class="description">

                  <div class="description-title">
                    ADDITIONAL NOTES
                  </div>

                  <div class="description-text">

                    ${escapeHtml(
                      request.notes
                    )}

                  </div>

                </div>

              `
              : ''
          }


          <div class="actions">


            ${
              request.model_file_url
                ? `

                  <a
                    class="action-btn model"
                    href="${escapeHtml(
                      request.model_file_url
                    )}"
                    target="_blank"
                    rel="noopener">

                    📦 Open 3D Model

                  </a>

                `
                : ''
            }


            ${
              request.reference_image_url
                ? `

                  <a
                    class="action-btn image"
                    href="${escapeHtml(
                      request.reference_image_url
                    )}"
                    target="_blank"
                    rel="noopener">

                    🖼 Open Reference

                  </a>

                `
                : ''
            }


            <a
              class="action-btn whatsapp"
              href="${escapeHtml(
                whatsappLink(request)
              )}"
              target="_blank"
              rel="noopener">

              WhatsApp

            </a>


            <select
              class="status-select"
              data-id="${escapeHtml(
                request.id
              )}">

              <option
                value="pending"
                ${status === 'pending' ? 'selected' : ''}>

                Pending

              </option>

              <option
                value="reviewing"
                ${status === 'reviewing' ? 'selected' : ''}>

                Reviewing

              </option>

              <option
                value="approved"
                ${status === 'approved' ? 'selected' : ''}>

                Approved

              </option>

              <option
                value="rejected"
                ${status === 'rejected' ? 'selected' : ''}>

                Rejected

              </option>

              <option
                value="completed"
                ${status === 'completed' ? 'selected' : ''}>

                Completed

              </option>

            </select>


          </div>


        </div>

      `;


      requestsEl.appendChild(card);

    }
  );


  document
    .querySelectorAll('.status-select')
    .forEach(select => {

      select.addEventListener(
        'change',
        async function(){

          await updateStatus(
            this.dataset.id,
            this.value
          );

        }
      );

    });

}


/* =========================
   UPDATE STATUS
========================= */

async function updateStatus(
  id,
  newStatus
){

  clearError();


  try{

    const {
      error
    } =
      await supabaseClient
        .from('custom_requests')
        .update({
          status:newStatus
        })
        .eq('id',id);


    if(error){

      throw error;

    }


    const request =
      allRequests.find(
        r => r.id === id
      );


    if(request){

      request.status =
        newStatus;

    }


    updateStats();

    renderRequests();


  }catch(error){

    console.error(error);

    showError(
      'Could not update request status. ' +
      (error?.message || '')
    );

    await loadRequests();

  }

}


/* =========================
   EVENTS
========================= */

refreshBtn.addEventListener(
  'click',
  loadRequests
);


searchInput.addEventListener(
  'input',
  renderRequests
);


statusFilter.addEventListener(
  'change',
  renderRequests
);


document
  .getElementById('clearBtn')
  .addEventListener(
    'click',
    () => {

      searchInput.value =
        '';

      statusFilter.value =
        '';

      renderRequests();

    }
  );


/* =========================
   YEAR
========================= */

document.getElementById(
  'year'
).textContent =
  new Date().getFullYear();


/* =========================
   START
========================= */

loadRequests();

</script>
